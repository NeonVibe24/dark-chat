<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section id="authScreen">


    <!-- ================= LOGIN ================= -->

    <div id="loginBox">

      <h1>Private Chat</h1>

      <form id="loginForm">

        <input
          type="text"
          id="loginUsername"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="loginPassword"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
        >
          Login
        </button>

        <div
          id="loginError"
          class="error"
        ></div>

      </form>


      <div class="auth-switch">

        Don't have an account?

        <button
          type="button"
          id="showRegisterBtn"
        >
          Register
        </button>

      </div>

    </div>



    <!-- ================= REGISTER ================= -->

    <div
      id="registerBox"
      class="hidden"
    >

      <h1>Create Account</h1>

      <form id="registerForm">

        <input
          type="text"
          id="registerUsername"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="registerPassword"
          name="password"
          placeholder="Password"
          autocomplete="new-password"
          required
        >

        <input
          type="password"
          id="registerPasswordConfirm"
          name="passwordConfirm"
          placeholder="Confirm Password"
          autocomplete="new-password"
          required
        >

        <button
          type="submit"
        >
          Register
        </button>

        <div
          id="registerError"
          class="error"
        ></div>

      </form>


      <div class="auth-switch">

        Already have an account?

        <button
          type="button"
          id="showLoginBtn"
        >
          Login
        </button>

      </div>

    </div>

  </section>



  <!-- =====================================================
       CHAT SCREEN
  ====================================================== -->

  <section
    id="chatScreen"
    class="hidden"
  >


    <!-- ===================================================
         PUBLIC GROUP CHAT
    ==================================================== -->

    <main
      id="groupChat"
      class="active-chat"
    >


      <!-- ================= GROUP HEADER ================= -->

      <header
        class="chat-header group-header"
      >


        <!-- GROUP USER -->

        <div class="chat-user">


          <!-- GROUP AVATAR -->

          <div
            id="groupAvatar"
            class="avatar"
          >

            <span>
              G
            </span>

          </div>


          <!-- GROUP INFO -->

          <div class="chat-user-info">

            <span
              id="groupChatName"
              class="chat-username"
            >
              Public Group
            </span>

            <span
              id="groupChatStatus"
              class="chat-status"
            >
              Group Chat
            </span>

          </div>

        </div>



        <!-- ================= HEADER ACTIONS ================= -->

        <div class="header-actions">


          <!-- MY PROFILE -->

          <div class="my-profile">

            <button
              type="button"
              id="myAvatarBtn"
              title="Profile"
            >

              <div class="avatar">

                <img
                  id="myAvatar"
                  src=""
                  alt=""
                  class="hidden"
                >

                <span
                  id="myAvatarFallback"
                >
                  U
                </span>

              </div>


              <!-- UNREAD BADGE -->

              <span
                id="profileNotificationBadge"
              ></span>

            </button>


            <span
              id="myUsername"
              class="hidden"
            ></span>

          </div>



          <!-- REFRESH GROUP -->

          <button
            type="button"
            id="reloadGroupMessages"
            title="Refresh"
            aria-label="Refresh group messages"
          >
            ↻
          </button>



          <!-- LOGOUT -->

          <button
            type="button"
            id="logoutBtn"
            title="Logout"
            aria-label="Logout"
          >
            ⎋
          </button>

        </div>

      </header>



      <!-- ================= GROUP MESSAGES ================= -->

      <div
        id="groupMessages"
      ></div>



      <!-- ================= GROUP MESSAGE FORM ================= -->

      <form
        id="groupMessageForm"
        class="message-form"
      >

        <input
          type="text"
          id="groupMessageInput"
          name="message"
          placeholder="Write a message..."
          autocomplete="off"
          maxlength="2000"
          required
        >

        <button
          type="submit"
          title="Send"
          aria-label="Send message"
        >
          ➤
        </button>

      </form>

    </main>



    <!-- ===================================================
         PRIVATE CHAT
    ==================================================== -->

    <main
      id="privateChat"
      class="active-chat hidden"
    >


      <!-- ================= PRIVATE HEADER ================= -->

      <header
        class="chat-header private-chat-header"
      >


        <!-- ================= LEFT SIDE ================= -->

        <div
          class="chat-user private-chat-user"
        >


          <!-- BACK TO GROUP -->

          <button
            type="button"
            id="privateBackBtn"
            class="private-back-btn"
            title="Back to Group Chat"
            aria-label="Back to Group Chat"
          >
            ←
          </button>



          <!-- PRIVATE AVATAR -->

          <div
            id="chatAvatar"
            class="avatar"
          >

            <img
              id="chatAvatarImage"
              src=""
              alt=""
              class="hidden"
            >

            <span
              id="chatAvatarFallback"
            >
              U
            </span>

          </div>



          <!-- PRIVATE USER INFO -->

          <div class="chat-user-info">

            <span
              id="chatUsername"
              class="chat-username"
            >
              User
            </span>

            <span
              id="chatStatus"
              class="chat-status"
            >
              Private Chat
            </span>

          </div>

        </div>



        <!-- ================= RIGHT SIDE ================= -->

        <div class="header-actions">


          <!-- REFRESH PRIVATE CHAT -->

          <button
            type="button"
            id="reloadMessages"
            title="Refresh"
            aria-label="Refresh messages"
          >
            ↻
          </button>

        </div>

      </header>



      <!-- ================= PRIVATE MESSAGES ================= -->

      <div
        id="messagesBox"
      ></div>



      <!-- ================= PRIVATE MESSAGE FORM ================= -->

      <form
        id="messageForm"
        class="private-message-form"
      >

        <input
          type="text"
          id="messageInput"
          name="message"
          placeholder="Write a message..."
          autocomplete="off"
          maxlength="2000"
          required
        >

        <button
          type="submit"
          title="Send"
          aria-label="Send message"
        >
          ➤
        </button>

      </form>

    </main>



    <!-- ===================================================
         EMPTY CHAT
    ==================================================== -->

    <section
      id="emptyChat"
      class="hidden"
    >

      <div>
        Select a user to start a private chat.
      </div>

    </section>

  </section>



  <!-- =====================================================
       PROFILE PANEL
  ====================================================== -->

  <aside
    id="profilePanel"
    class="profile-panel hidden"
  >


    <!-- ================= PROFILE HEADER ================= -->

    <header
      class="profile-panel-header"
    >

      <h3>
        Profile
      </h3>

      <button
        type="button"
        id="closeProfileBtn"
        class="icon-btn"
        title="Close"
        aria-label="Close profile"
      >
        ×
      </button>

    </header>



    <!-- ================= PROFILE INFO ================= -->

    <div
      class="profile-panel-info"
    >


      <!-- PROFILE AVATAR -->

      <div
        id="profileAvatar"
      >

        <img
          id="profileAvatarImage"
          src=""
          alt=""
          class="hidden"
        >

        <span
          id="profileAvatarFallback"
        >
          U
        </span>

      </div>



      <!-- USERNAME -->

      <div
        id="profileUsername"
      >
        User
      </div>

    </div>



    <!-- ================= EDIT PROFILE ================= -->

    <button
      type="button"
      id="editProfileBtn"
      class="edit-profile-btn"
    >
      Edit Profile
    </button>



    <!-- ===================================================
         PRIVATE INBOX
    ==================================================== -->

    <section
      id="privateInbox"
      class="private-inbox"
    >


      <!-- ================= INBOX TITLE ================= -->

      <div
        class="private-inbox-title"
      >

        <span>
          Messages
        </span>

        <span
          id="privateInboxCount"
          class="private-inbox-count"
        >
          0
        </span>

      </div>



      <!-- ================= USER LIST ================= -->

      <div
        id="privateUserList"
        class="private-user-list"
      ></div>



      <!-- ================= EMPTY INBOX ================= -->

      <div
        id="privateInboxEmpty"
        class="private-inbox-empty hidden"
      >
        No messages yet.
      </div>

    </section>



    <!-- ===================================================
         PROFILE PHOTO CONTROLS
    ==================================================== -->

    <div
      class="profile-photo-actions"
    >


      <!-- CHANGE PHOTO -->

      <label
        for="profilePhotoInput"
        class="profile-photo-button"
      >
        Change Photo

        <input
          type="file"
          id="profilePhotoInput"
          accept="image/*"
        >

      </label>



      <!-- REMOVE PHOTO -->

      <button
        type="button"
        id="removeProfilePhoto"
      >
        Remove
      </button>

    </div>



    <!-- ================= PROFILE ACTIONS ================= -->

    <div
      class="profile-panel-actions"
    ></div>

  </aside>



  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="hidden"
  ></div>



  <!-- =====================================================
       CALL UI
       Intentionally not included
  ====================================================== -->


</div>



<!-- =======================================================
     AUTH SWITCH
======================================================== -->

<script>

  const loginBox =
    document.getElementById("loginBox");

  const registerBox =
    document.getElementById("registerBox");

  const showRegisterBtn =
    document.getElementById("showRegisterBtn");

  const showLoginBtn =
    document.getElementById("showLoginBtn");


  if (showRegisterBtn) {

    showRegisterBtn.addEventListener(
      "click",
      () => {

        loginBox.classList.add("hidden");

        registerBox.classList.remove("hidden");

      }
    );

  }


  if (showLoginBtn) {

    showLoginBtn.addEventListener(
      "click",
      () => {

        registerBox.classList.add("hidden");

        loginBox.classList.remove("hidden");

      }
    );

  }

</script>



<!-- =======================================================
     APP JS
======================================================== -->

<script
  src="/app.js"
></script>


</body>

</html>
