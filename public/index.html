<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #0b0f14;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }


    /* =====================================================
       APP
    ===================================================== */

    #app {
      width: 100%;
      height: 100%;
      min-height: 100vh;
    }


    /* =====================================================
       AUTH
    ===================================================== */

    #authScreen {
      width: 100%;
      height: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          rgba(40, 100, 180, 0.18),
          transparent 45%
        ),
        #0b0f14;
    }

    .auth-card {
      width: 100%;
      max-width: 390px;

      padding: 30px;

      background: rgba(18, 24, 32, 0.96);

      border: 1px solid #26313d;

      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .auth-card h1 {
      margin: 0 0 8px;

      text-align: center;

      font-size: 28px;
      font-weight: 700;
    }

    .auth-subtitle {
      margin: 0 0 25px;

      text-align: center;

      color: #8d9aaa;

      font-size: 14px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .auth-form input {
      width: 100%;

      height: 48px;

      padding: 0 15px;

      border: 1px solid #303b48;
      border-radius: 12px;

      outline: none;

      background: #0e141b;

      color: #fff;

      font-size: 15px;
    }

    .auth-form input:focus {
      border-color: #4f8cff;
    }

    .auth-form button {
      width: 100%;

      height: 48px;

      border: none;
      border-radius: 12px;

      background: #3478f6;

      color: #fff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }

    .auth-form button:active {
      transform: scale(0.99);
    }

    .auth-switch {
      margin-top: 18px;

      text-align: center;

      color: #8d9aaa;

      font-size: 14px;
    }

    .auth-switch button {
      border: none;

      background: transparent;

      color: #4f8cff;

      cursor: pointer;

      font-size: 14px;
    }

    .auth-error {
      min-height: 18px;

      color: #ff5f6d;

      font-size: 13px;

      text-align: center;
    }


    /* =====================================================
       CHAT SCREEN
    ===================================================== */

    #chatScreen {
      display: none;

      width: 100%;
      height: 100%;
      min-height: 100vh;

      position: relative;
    }

    .chat-area {
      width: 100%;
      height: 100%;

      display: flex;

      background: #0b0f14;
    }


    /* =====================================================
       GROUP CHAT
    ===================================================== */

    #groupChat {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #0b0f14;
    }

    .group-header {
      width: 100%;

      min-height: 70px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 10px 15px;

      border-bottom: 1px solid #202933;

      background: #10161e;
    }

    #groupAvatar {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #3478f6;

      color: #fff;

      font-size: 19px;
      font-weight: 700;
    }

    .group-info {
      min-width: 0;

      flex: 1;
    }

    #groupChatName {
      margin: 0;

      color: #fff;

      font-size: 16px;
      font-weight: 600;
    }

    #groupChatStatus {
      margin-top: 3px;

      color: #7f8b99;

      font-size: 12px;
    }


    /* =====================================================
       MY PROFILE
    ===================================================== */

    #myProfile {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-left: auto;
    }

    #myAvatarBtn {
      width: 40px;
      height: 40px;

      padding: 0;

      border: none;

      border-radius: 50%;

      background: transparent;

      cursor: pointer;

      overflow: hidden;
    }

    #myAvatar {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      border-radius: 50%;

      background: #263343;
    }

    #myAvatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;
    }

    #myAvatarFallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      font-size: 15px;
      font-weight: 600;
    }

    #myUsername {
      max-width: 110px;

      overflow: hidden;

      text-overflow: ellipsis;
      white-space: nowrap;

      color: #c8d0da;

      font-size: 13px;
    }


    /* =====================================================
       HEADER BUTTONS
    ===================================================== */

    .header-button {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #2a3542;
      border-radius: 10px;

      background: #151c25;

      color: #b7c1cc;

      cursor: pointer;

      font-size: 16px;
    }

    .header-button:hover {
      background: #1b2531;
    }

    #logoutBtn {
      color: #ff707c;
    }


    /* =====================================================
       GROUP MESSAGES
    ===================================================== */

    #groupMessages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 18px 15px 10px;

      display: flex;
      flex-direction: column;

      gap: 9px;
    }

    #groupMessages::-webkit-scrollbar,
    #messagesBox::-webkit-scrollbar {
      width: 5px;
    }

    #groupMessages::-webkit-scrollbar-thumb,
    #messagesBox::-webkit-scrollbar-thumb {
      background: #2b3541;

      border-radius: 10px;
    }

    .group-message {
      width: 100%;

      display: flex;

      gap: 9px;
    }

    .group-message-avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #263343;

      overflow: hidden;

      color: #fff;

      font-size: 12px;
      font-weight: 600;
    }

    .group-message-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .group-message-content {
      max-width: min(75%, 600px);
    }

    .group-message-username {
      margin-bottom: 3px;

      color: #7ea8ff;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;
    }

    .group-message-text {
      padding: 9px 12px;

      border-radius: 12px;

      background: #151c25;

      color: #e8edf3;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;
    }

    .group-message-time {
      margin-top: 3px;

      color: #687483;

      font-size: 10px;
    }


    /* =====================================================
       GROUP MESSAGE FORM
    ===================================================== */

    #groupMessageForm {
      width: 100%;

      display: flex;

      gap: 8px;

      padding: 10px 12px;

      border-top: 1px solid #202933;

      background: #10161e;
    }

    #groupMessageInput {
      flex: 1;

      min-width: 0;

      height: 46px;

      padding: 0 14px;

      border: 1px solid #2c3744;

      border-radius: 12px;

      outline: none;

      background: #0d131a;

      color: #fff;

      font-size: 14px;
    }

    #groupMessageInput:focus {
      border-color: #4f8cff;
    }

    #groupMessageForm button {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border: none;

      border-radius: 12px;

      background: #3478f6;

      color: #fff;

      cursor: pointer;

      font-size: 17px;
    }


    /* =====================================================
       PRIVATE CHAT
    ===================================================== */

    #privateChat {
      width: 100%;
      height: 100%;

      display: none;
      flex-direction: column;

      background: #0b0f14;
    }

    .private-header {
      min-height: 70px;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 10px 15px;

      border-bottom: 1px solid #202933;

      background: #10161e;
    }

    #chatAvatar {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      border-radius: 50%;

      background: #263343;

      overflow: hidden;
    }

    #chatAvatarFallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      font-size: 17px;
      font-weight: 600;
    }

    #chatAvatarImage {
      width: 100%;
      height: 100%;

      display: none;

      object-fit: cover;

      border-radius: 50%;
    }

    .private-user-info {
      flex: 1;

      min-width: 0;
    }

    #chatUsername {
      margin: 0;

      overflow: hidden;

      text-overflow: ellipsis;
      white-space: nowrap;

      color: #fff;

      font-size: 16px;
      font-weight: 600;
    }

    #chatStatus {
      margin-top: 3px;

      color: #7f8b99;

      font-size: 12px;
    }


    /* =====================================================
       PRIVATE MESSAGES
    ===================================================== */

    #messagesBox {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 18px 15px;

      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .message {
      max-width: 78%;

      display: flex;
      flex-direction: column;
    }

    .message.sent {
      align-self: flex-end;

      align-items: flex-end;
    }

    .message.received {
      align-self: flex-start;

      align-items: flex-start;
    }

    .message-bubble {
      padding: 9px 12px;

      border-radius: 13px;

      color: #fff;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;
    }

    .message.sent .message-bubble {
      background: #3478f6;

      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: #18212c;

      border-bottom-left-radius: 4px;
    }

    .message-time {
      margin-top: 3px;

      color: #687483;

      font-size: 10px;
    }


    /* =====================================================
       PRIVATE MESSAGE FORM
    ===================================================== */

    #messageForm {
      width: 100%;

      display: flex;

      gap: 8px;

      padding: 10px 12px;

      border-top: 1px solid #202933;

      background: #10161e;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      height: 46px;

      padding: 0 14px;

      border: 1px solid #2c3744;

      border-radius: 12px;

      outline: none;

      background: #0d131a;

      color: #fff;

      font-size: 14px;
    }

    #messageInput:focus {
      border-color: #4f8cff;
    }

    #messageForm button {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border: none;

      border-radius: 12px;

      background: #3478f6;

      color: #fff;

      cursor: pointer;

      font-size: 17px;
    }


    /* =====================================================
       EMPTY CHAT
    ===================================================== */

    #emptyChat {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 25px;

      background: #0b0f14;
    }

    .empty-chat-content {
      text-align: center;

      color: #687483;
    }

    .empty-chat-content h2 {
      margin: 0 0 8px;

      color: #b9c3cf;

      font-size: 20px;
    }

    .empty-chat-content p {
      margin: 0;

      font-size: 13px;
    }


    /* =====================================================
       PROFILE PANEL
    ===================================================== */

    #profilePanel {
      position: fixed;

      top: 0;
      right: 0;

      width: min(360px, 100%);

      height: 100%;

      display: none;

      flex-direction: column;

      z-index: 100;

      background: #10161e;

      border-left: 1px solid #27313c;

      box-shadow:
        -20px 0 50px rgba(0, 0, 0, 0.35);
    }

    .profile-header {
      height: 65px;

      display: flex;
      align-items: center;

      padding: 0 15px;

      border-bottom: 1px solid #202933;
    }

    .profile-header h3 {
      margin: 0;

      font-size: 17px;
    }

    .profile-close {
      width: 36px;
      height: 36px;

      margin-left: auto;

      border: none;

      border-radius: 9px;

      background: #19212b;

      color: #fff;

      cursor: pointer;

      font-size: 18px;
    }

    .profile-body {
      padding: 25px 18px;
    }

    #profileAvatar {
      width: 110px;
      height: 110px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #263343;

      overflow: hidden;
    }

    #profileAvatarImage {
      width: 100%;
      height: 100%;

      display: none;

      object-fit: cover;

      border-radius: 50%;
    }

    #profileAvatarFallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      font-size: 36px;
      font-weight: 600;
    }

    #profileUsername {
      margin: 0 0 20px;

      text-align: center;

      color: #fff;

      font-size: 18px;
      font-weight: 600;
    }

    .profile-action {
      width: 100%;

      height: 45px;

      margin-bottom: 10px;

      border: 1px solid #2c3744;

      border-radius: 11px;

      background: #151d26;

      color: #dce3eb;

      cursor: pointer;

      font-size: 14px;
    }

    .profile-action:hover {
      background: #1b2530;
    }

    #removeProfilePhoto {
      color: #ff6874;

      border-color: #3b2529;
    }

    #profilePhotoInput {
      display: none;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    #toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%) translateY(20px);

      z-index: 500;

      min-width: 180px;
      max-width: calc(100% - 30px);

      padding: 11px 16px;

      border: 1px solid #2b3540;

      border-radius: 10px;

      background: #18212b;

      color: #fff;

      text-align: center;

      font-size: 13px;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    #toast.show {
      opacity: 1;

      transform: translateX(-50%) translateY(0);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .auth-card {
        padding: 24px 20px;

        border-radius: 17px;
      }

      .group-header,
      .private-header {
        min-height: 62px;

        padding: 8px 10px;
      }

      #groupAvatar,
      #chatAvatar {
        width: 42px;
        height: 42px;
      }

      #myUsername {
        display: none;
      }

      .header-button {
        width: 35px;
        height: 35px;
      }

      #groupMessages,
      #messagesBox {
        padding-left: 10px;
        padding-right: 10px;
      }

      .group-message-content {
        max-width: 82%;
      }

      .message {
        max-width: 85%;
      }

      #profilePanel {
        width: 100%;
      }

    }

  </style>

</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH SCREEN
  ===================================================== -->

  <div id="authScreen">

    <div class="auth-card">


      <!-- =================================================
           LOGIN
      ================================================= -->

      <div id="loginBox">

        <h1>Private Chat</h1>

        <p class="auth-subtitle">
          Sign in to continue
        </p>

        <form
          id="loginForm"
          class="auth-form"
        >

          <input
            id="loginUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
            required
          >

          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >

          <div
            id="loginError"
            class="auth-error"
          ></div>

          <button type="submit">
            Login
          </button>

        </form>


        <div class="auth-switch">

          Don't have an account?

          <button
            type="button"
            id="showRegister"
          >
            Register
          </button>

        </div>

      </div>


      <!-- =================================================
           REGISTER
      ================================================= -->

      <div
        id="registerBox"
        style="display:none;"
      >

        <h1>Create Account</h1>

        <p class="auth-subtitle">
          Create your Private Chat account
        </p>

        <form
          id="registerForm"
          class="auth-form"
        >

          <input
            id="registerUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
            required
          >

          <input
            id="registerPassword"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
            required
          >

          <input
            id="registerPasswordConfirm"
            type="password"
            placeholder="Confirm Password"
            autocomplete="new-password"
            required
          >

          <div
            id="registerError"
            class="auth-error"
          ></div>

          <button type="submit">
            Register
          </button>

        </form>


        <div class="auth-switch">

          Already have an account?

          <button
            type="button"
            id="showLogin"
          >
            Login
          </button>

        </div>

      </div>


    </div>

  </div>



  <!-- =====================================================
       CHAT SCREEN
  ===================================================== -->

  <div id="chatScreen">


    <div class="chat-area">


      <!-- =================================================
           PUBLIC GROUP CHAT
      ================================================= -->

      <section id="groupChat">


        <!-- GROUP HEADER -->

        <header class="group-header">


          <div id="groupAvatar">
            G
          </div>


          <div class="group-info">

            <div id="groupChatName">
              Public Group Chat
            </div>

            <div id="groupChatStatus">
              Everyone
            </div>

          </div>


          <!-- MY PROFILE -->

          <div id="myProfile">

            <button
              type="button"
              id="myAvatarBtn"
              title="Profile"
            >

              <div id="myAvatar">

                <img
                  id="myAvatarImage"
                  alt=""
                  style="display:none;"
                >

                <div id="myAvatarFallback">
                  U
                </div>

              </div>

            </button>


            <div id="myUsername">
              User
            </div>

          </div>


          <!-- RELOAD -->

          <button
            type="button"
            id="reloadGroupMessages"
            class="header-button"
            title="Reload"
          >
            ↻
          </button>


          <!-- LOGOUT -->

          <button
            type="button"
            id="logoutBtn"
            class="header-button"
            title="Logout"
          >
            ⎋
          </button>


        </header>



        <!-- GROUP MESSAGES -->

        <div id="groupMessages"></div>



        <!-- GROUP MESSAGE FORM -->

        <form id="groupMessageForm">

          <input
            id="groupMessageInput"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
            maxlength="2000"
          >

          <button
            type="submit"
            title="Send"
          >
            ➤
          </button>

        </form>


      </section>



      <!-- =================================================
           PRIVATE CHAT
      ================================================= -->

      <section id="privateChat">


        <!-- PRIVATE HEADER -->

        <header class="private-header">


          <div id="chatAvatar">

            <div id="chatAvatarFallback">
              U
            </div>

            <img
              id="chatAvatarImage"
              alt=""
            >

          </div>


          <div class="private-user-info">

            <div id="chatUsername">
              Private Chat
            </div>

            <div id="chatStatus">
              Private
            </div>

          </div>


          <button
            type="button"
            id="reloadMessages"
            class="header-button"
            title="Reload"
          >
            ↻
          </button>


        </header>



        <!-- PRIVATE MESSAGES -->

        <div id="messagesBox"></div>



        <!-- PRIVATE MESSAGE FORM -->

        <form id="messageForm">

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
            maxlength="2000"
          >

          <button
            type="submit"
            title="Send"
          >
            ➤
          </button>

        </form>


      </section>



      <!-- =================================================
           EMPTY CHAT
      ================================================= -->

      <section id="emptyChat">

        <div class="empty-chat-content">

          <h2>Private Chat</h2>

          <p>
            Select a user to start a private conversation.
          </p>

        </div>

      </section>


    </div>


  </div>



  <!-- =====================================================
       PROFILE PANEL
  ===================================================== -->

  <aside id="profilePanel">


    <div class="profile-header">

      <h3>
        My Profile
      </h3>


      <button
        type="button"
        class="profile-close"
        id="closeProfilePanel"
      >
        ×
      </button>

    </div>



    <div class="profile-body">


      <div id="profileAvatar">

        <img
          id="profileAvatarImage"
          alt=""
        >

        <div id="profileAvatarFallback">
          U
        </div>

      </div>


      <div id="profileUsername">
        User
      </div>


      <input
        id="profilePhotoInput"
        type="file"
        accept="image/*"
      >


      <button
        type="button"
        id="changeProfilePhoto"
        class="profile-action"
      >
        Change Profile Photo
      </button>


      <button
        type="button"
        id="removeProfilePhoto"
        class="profile-action"
      >
        Remove Profile Photo
      </button>


    </div>


  </aside>



  <!-- =====================================================
       TOAST
  ===================================================== -->

  <div id="toast"></div>


</div>



<!-- =====================================================
     APP JS
===================================================== -->

<script src="/app.js"></script>



<!-- =====================================================
     AUTH SWITCH
===================================================== -->

<script>

(function () {

  const showRegister =
    document.getElementById("showRegister");

  const showLogin =
    document.getElementById("showLogin");

  const loginBox =
    document.getElementById("loginBox");

  const registerBox =
    document.getElementById("registerBox");


  if (showRegister) {

    showRegister.addEventListener(
      "click",
      function (event) {

        event.preventDefault();
        event.stopPropagation();

        loginBox.style.display = "none";
        registerBox.style.display = "block";

      },
      true
    );

  }


  if (showLogin) {

    showLogin.addEventListener(
      "click",
      function (event) {

        event.preventDefault();
        event.stopPropagation();

        registerBox.style.display = "none";
        loginBox.style.display = "block";

      },
      true
    );

  }


})();

</script>


</body>
