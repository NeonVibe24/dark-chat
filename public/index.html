<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dark Chat</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

  <!-- LOGIN / REGISTER -->

  <section id="authScreen" class="auth-screen">

    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon">D</div>

        <div>
          <h1>Dark Chat</h1>
          <p>Private messaging</p>
        </div>
      </div>

      <!-- LOGIN -->

      <form id="loginForm">

        <h2>Welcome back</h2>

        <p class="auth-subtitle">
          Sign in to continue
        </p>

        <div class="field">

          <label>Email</label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

        <button class="primary-btn" type="submit">
          Sign In
        </button>

        <div id="loginError" class="error"></div>

        <button
          type="button"
          class="switch-btn"
          id="showRegister"
        >
          Create an account
        </button>

      </form>


      <!-- REGISTER -->

      <form id="registerForm" class="hidden">

        <h2>Create account</h2>

        <p class="auth-subtitle">
          Join Dark Chat
        </p>

        <div class="field">

          <label>Username</label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >

        </div>

        <div class="field">

          <label>Email</label>

          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >

        </div>

        <button class="primary-btn" type="submit">
          Create Account
        </button>

        <div id="registerError" class="error"></div>

        <button
          type="button"
          class="switch-btn"
          id="showLogin"
        >
          Already have an account?
        </button>

      </form>

    </div>

  </section>


  <!-- CHAT APP -->

  <section id="chatScreen" class="chat-screen hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="profile">

          <div id="myAvatar" class="avatar">
            D
          </div>

          <div class="profile-info">

            <strong id="myUsername">
              User
            </strong>

            <span>Online</span>

          </div>

        </div>

        <button
          id="logoutBtn"
          class="icon-btn"
          title="Logout"
        >
          ⎋
        </button>

      </div>


      <div class="sidebar-title">
        <span>Messages</span>

        <button
          id="refreshUsers"
          class="small-btn"
          title="Refresh"
        >
          ↻
        </button>
      </div>


      <div id="usersList" class="users-list">

        <div class="loading">
          Loading users...
        </div>

      </div>

    </aside>


    <!-- CHAT AREA -->

    <main class="chat-area">

      <!-- EMPTY -->

      <div
        id="emptyChat"
        class="empty-chat"
      >

        <div class="empty-icon">
          ◇
        </div>

        <h2>Select a conversation</h2>

        <p>
          Choose someone from the list to start chatting.
        </p>

      </div>


      <!-- ACTIVE CHAT -->

      <div
        id="activeChat"
        class="active-chat hidden"
      >

        <header class="chat-header">

          <div class="chat-user">

            <div
              id="chatAvatar"
              class="avatar"
            >
              U
            </div>

            <div>

              <strong id="chatUsername">
                User
              </strong>

              <span id="chatStatus">
                Offline
              </span>

            </div>

          </div>

          <button
            id="reloadMessages"
            class="icon-btn"
            title="Refresh messages"
          >
            ↻
          </button>

        </header>


        <div
          id="messages"
          class="messages"
        ></div>


        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
          >

          <button
            class="send-btn"
            type="submit"
          >
            ➤
          </button>

        </form>

      </div>

    </main>

  </section>

</div>


<div
  id="toast"
  class="toast"
></div>


<script src="/app.js"></script>

</body>
</html>
