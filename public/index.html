<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b172a"
  >

  <title>Dark Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
    }

    #chatScreen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    #chatScreen.hidden {
      display: none !important;
    }


    /* =====================================================
       SIDEBAR
    ====================================================== */

    #chatScreen .sidebar {
      flex: 0 0 300px;
      width: 300px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      background: inherit;
    }


    /* =====================================================
       MAIN CHAT AREA
    ====================================================== */

    #chatScreen .chat-area {
      flex: 1;
      width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }


    /* =====================================================
       ACTIVE CHAT (GROUP & PRIVATE)
    ====================================================== */

    #groupChat,
    #privateChat {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #groupChat.hidden,
    #privateChat.hidden {
      display: none !important;
    }


    /* =====================================================
       CHAT HEADER
    ====================================================== */

    #chatScreen .chat-header {
      flex: 0 0 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* =====================================================
       MESSAGES
    ====================================================== */

    #chatScreen .messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      box-sizing: border-box;
    }


    /* =====================================================
       MESSAGE FORMS & INPUTS
    ====================================================== */

    #groupMessageForm,
    #messageForm {
      flex: 0 0 64px !important;
      height: 64px !important;
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
      padding: 10px 16px !important;
      box-sizing: border-box !important;
      border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
      background: inherit !important;
      position: relative !important;
      z-index: 10 !important;
    }

    #groupMessageInput,
    #messageInput {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      flex: 1;
      height: 40px;
      padding: 0 12px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: inherit;
    }

    #groupMessageForm .send-btn,
    #messageForm .send-btn {
      flex: 0 0 40px;
      height: 40px;
      width: 40px;
      margin-left: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =====================================================
       MOBILE RESPONSIVE
    ====================================================== */

    @media (max-width: 768px) {
      #chatScreen {
        flex-direction: column;
      }

      #chatScreen .sidebar {
        width: 100%;
        height: 100%;
      }

      #chatScreen .chat-area {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: inherit;
        z-index: 5;
      }

      #chatScreen .chat-area:has(.active-chat.hidden) {
        display: none !important;
      }
    }

  </style>

</head>


<body>

<div id="app">

  <section
    id="authScreen"
    class="auth-screen"
  >
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">D</div>
        <div>
          <h1>Dark Chat</h1>
          <p>Private messaging</p>
        </div>
      </div>

      <form id="loginForm">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to continue</p>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>
        <button
          class="primary-btn"
          type="submit"
        >Sign In</button>
        <div
          id="loginError"
          class="error"
          role="alert"
        ></div>
        <button
          type="button"
          class="switch-btn"
          id="showRegister"
        >Create an account</button>
      </form>

      <form
        id="registerForm"
        class="hidden"
      >
        <h2>Create account</h2>
        <p class="auth-subtitle">Join Dark Chat</p>
        <div class="field">
          <label for="registerUsername">Username</label>
          <input
            id="registerUsername"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >
        </div>
        <div class="field">
          <label for="registerEmail">Email</label>
          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >
        </div>
        <button
          class="primary-btn"
          type="submit"
        >Create Account</button>
        <div
          id="registerError"
          class="error"
          role="alert"
        ></div>
        <button
          type="button"
          class="switch-btn"
          id="showLogin"
        >Already have an account?</button>
      </form>
    </div>
  </section>

  <section
    id="chatScreen"
    class="chat-screen hidden"
  >

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="profile">
          <button
            id="myAvatarBtn"
            class="avatar-button"
            type="button"
            title="Profile"
          >
            <div
              id="myAvatar"
              class="avatar"
            >D</div>
          </button>
          <div class="profile-info">
            <strong id="myUsername">User</strong>
            <span>Online</span>
          </div>
        </div>
        <button
          id="logoutBtn"
          class="icon-btn"
          type="button"
          title="Logout"
        >⎋</button>
      </div>

      <div class="sidebar-title">
        <span>People</span>
        <button
          id="refreshUsers"
          class="small-btn"
          type="button"
          title="Refresh"
        >↻</button>
      </div>

      <div
        id="usersList"
        class="users-list"
      >
        <div class="loading">Loading users...</div>
      </div>
    </aside>

    <main class="chat-area">

      <div
        id="groupChat"
        class="active-chat"
      >
        <header class="chat-header">
          <div class="chat-user">
            <div
              id="groupAvatar"
              class="avatar"
            >G</div>
            <div>
              <strong id="groupChatName">Group Chat</strong>
              <span id="groupChatStatus">Everyone</span>
            </div>
          </div>
          <div class="chat-actions">
            <button
              id="reloadGroupMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
            >↻</button>
          </div>
        </header>

        <div
          id="groupMessages"
          class="messages"
        ></div>

        <form
          id="groupMessageForm"
          class="message-form"
        >
          <input
            id="groupMessageInput"
            type="text"
            placeholder="Write a message to everyone..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >
          <button
            id="groupSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
          >➤</button>
        </form>
      </div>

      <div
        id="privateChat"
        class="active-chat hidden"
      >
        <header class="chat-header">
          <div class="chat-user">
            <div
              id="chatAvatar"
              class="avatar"
            >U</div>
            <div>
              <strong id="chatUsername">User</strong>
              <span id="chatStatus">Offline</span>
            </div>
          </div>
          <div class="chat-actions">
            <button
              id="reloadMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
            >↻</button>
          </div>
        </header>

        <div
          id="messages"
          class="messages"
        ></div>

        <form
          id="messageForm"
          class="message-form"
        >
          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >
          <button
            id="privateSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
          >➤</button>
        </form>
      </div>

    </main>

  </section>

</div>

<div
  id="profilePanel"
  class="profile-panel hidden"
>
  <div
    class="profile-panel-backdrop"
    id="profilePanelBackdrop"
  ></div>
  <div class="profile-panel-card">
    <button
      id="closeProfilePanel"
      class="profile-close"
      type="button"
    >×</button>
    <button
      id="profilePhotoBtn"
      class="profile-photo-large-btn"
      type="button"
    >
      <div
        id="profilePhotoLarge"
        class="profile-photo-large"
      >D</div>
    </button>
    <h3 id="profilePanelName">User</h3>
    <p id="profilePanelEmail">user@email.com</p>
    <input
      id="profilePhotoInput"
      type="file"
      accept="image/*"
      hidden
    >
    <div class="profile-actions">
      <button
        id="changeProfilePhoto"
        class="primary-btn"
        type="button"
      >Change Photo</button>
      <button
        id="removeProfilePhoto"
        class="secondary-btn"
        type="button"
      >Remove</button>
    </div>
  </div>
</div>

<div
  id="toast"
  class="toast"
  role="status"
></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const usersListContainer = document.getElementById('usersList');
    const groupChat = document.getElementById('groupChat');
    const privateChat = document.getElementById('privateChat');
    const chatUsername = document.getElementById('chatUsername');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatStatus = document.getElementById('chatStatus');

    if (usersListContainer) {
      usersListContainer.addEventListener('click', (e) => {
        const userItem = e.target.closest('.user-item, [data-user-id], .profile, div');
        if (userItem) {
          const userNameText = userItem.textContent.trim() || 'User';
          
          if (groupChat && privateChat) {
            groupChat.classList.add('hidden');
            privateChat.classList.remove('hidden');
            
            if (chatUsername) {
              chatUsername.textContent = userNameText;
            }
            if (chatAvatar) {
              chatAvatar.textContent = userNameText.charAt(0).toUpperCase();
            }
            if (chatStatus) {
              chatStatus.textContent = 'Online';
            }
          }
        }
      });
    }
  });
</script>

<script src="/app.js"></script>

</body>

</html>
