<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b172a"
  >

  <title>Dark Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <!-- =====================================================
       IMPORTANT LAYOUT OVERRIDE
       Prevents mobile Chat Area from disappearing.
  ====================================================== -->

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    /* =====================================================
       CHAT SCREEN
    ====================================================== */

    #chatScreen {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    #chatScreen.hidden {
      display: none !important;
    }


    /* =====================================================
       SIDEBAR
    ====================================================== */

    #chatScreen .sidebar {
      flex: 0 0 320px;
      width: 320px;
      min-width: 280px;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }


    /* =====================================================
       MAIN CHAT AREA
    ====================================================== */

    #chatScreen .chat-area {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: flex !important;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }


    /* =====================================================
       ACTIVE CHAT
    ====================================================== */

    #chatScreen .active-chat {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chatScreen .active-chat.hidden {
      display: none !important;
    }


    /* =====================================================
       GROUP CHAT
    ====================================================== */

    #groupChat {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #groupChat.hidden {
      display: none !important;
    }


    /* =====================================================
       PRIVATE CHAT
    ====================================================== */

    #privateChat {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #privateChat.hidden {
      display: none !important;
    }


    /* =====================================================
       CHAT HEADER
    ====================================================== */

    #chatScreen .chat-header {
      flex: 0 0 auto;
      width: 100%;
      min-height: 72px;
      box-sizing: border-box;
    }


    /* =====================================================
       MESSAGES
    ====================================================== */

    #chatScreen .messages {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
    }


    /* =====================================================
       GROUP MESSAGE FORM
    ====================================================== */

    #groupMessageForm {
      flex: 0 0 auto !important;
      display: flex !important;
      width: 100%;
      min-height: 64px;
      box-sizing: border-box;
      position: relative;
      z-index: 5;
    }

    #groupMessageInput {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      flex: 1 1 auto;
      min-width: 0;
    }


    /* =====================================================
       PRIVATE MESSAGE FORM
    ====================================================== */

    #messageForm {
      flex: 0 0 auto !important;
      display: flex !important;
      width: 100%;
      min-height: 64px;
      box-sizing: border-box;
      position: relative;
      z-index: 5;
    }

    #messageInput {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      flex: 1 1 auto;
      min-width: 0;
    }


    /* =====================================================
       SEND BUTTON
    ====================================================== */

    #groupMessageForm .send-btn,
    #messageForm .send-btn {
      flex: 0 0 auto;
      cursor: pointer;
    }


    /* =====================================================
       EMPTY CHAT
    ====================================================== */

    #emptyChat {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #emptyChat.hidden {
      display: none !important;
    }


    /* =====================================================
       PROFILE CLICKABLE AREA
    ====================================================== */

    .avatar-button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .avatar-button:active {
      transform: scale(0.97);
    }


    /* =====================================================
       GROUP PROFILE BUTTONS
       Used by app.js when rendering group messages.
    ====================================================== */

    .group-profile-button,
    .group-message-user,
    .group-message-sender {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .group-profile-button {
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .group-message-user,
    .group-message-sender {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
    }


    /* =====================================================
       GROUP MESSAGE STRUCTURE
    ====================================================== */

    .group-message-row {
      display: flex;
      width: 100%;
      box-sizing: border-box;
    }

    .group-message-avatar {
      flex: 0 0 auto;
    }

    .group-message-content {
      min-width: 0;
    }

    .group-message-sender {
      display: inline-block;
    }

    .group-message-bubble {
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .group-message-time {
      display: block;
    }


    /* =====================================================
       MOBILE
       Keep BOTH People and Chat visible.
    ====================================================== */

    @media (max-width: 800px) {

      #chatScreen {
        display: flex !important;
        flex-direction: row !important;
      }

      #chatScreen .sidebar {
        flex: 0 0 34%;
        width: 34%;
        min-width: 0;
        max-width: 34%;
        height: 100%;
      }

      #chatScreen .chat-area {
        flex: 1 1 66%;
        width: 66%;
        min-width: 0;
        max-width: 66%;
        height: 100%;
        display: flex !important;
      }

      #chatScreen .sidebar-header {
        padding-left: 12px;
        padding-right: 12px;
      }

      #chatScreen .sidebar-title {
        padding-left: 12px;
        padding-right: 12px;
      }

      #chatScreen .profile-info {
        min-width: 0;
      }

      #chatScreen .profile-info strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #chatScreen .users-list {
        overflow-x: hidden;
      }

      #chatScreen .user-item {
        min-width: 0;
      }

      #chatScreen .user-info {
        min-width: 0;
      }

      #chatScreen .user-info strong,
      #chatScreen .user-info span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #chatScreen .chat-header {
        min-height: 68px;
        padding-left: 10px;
        padding-right: 10px;
      }

      #chatScreen .chat-user {
        min-width: 0;
      }

      #chatScreen .chat-user > div:last-child {
        min-width: 0;
      }

      #chatScreen .chat-user strong,
      #chatScreen .chat-user span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #groupMessageForm,
      #messageForm {
        min-height: 58px;
        padding: 8px;
      }

      #groupMessageInput,
      #messageInput {
        min-width: 0;
        font-size: 15px;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ====================================================== */

    @media (max-width: 430px) {

      #chatScreen .sidebar {
        flex-basis: 38%;
        width: 38%;
        max-width: 38%;
      }

      #chatScreen .chat-area {
        flex-basis: 62%;
        width: 62%;
        max-width: 62%;
      }

      #chatScreen .sidebar-header {
        padding: 10px;
      }

      #chatScreen .sidebar-title {
        padding: 10px;
      }

      #chatScreen .profile {
        gap: 7px;
      }

      #chatScreen .profile-info {
        display: none;
      }

      #chatScreen .sidebar .avatar {
        width: 42px;
        height: 42px;
      }

      #chatScreen .users-list .user-item {
        padding: 9px 7px;
      }

      #chatScreen .users-list .avatar {
        width: 38px;
        height: 38px;
      }

      #chatScreen .user-info span {
        display: none;
      }

      #chatScreen .chat-header {
        min-height: 62px;
      }

      #chatScreen .chat-header .avatar {
        width: 38px;
        height: 38px;
      }

      #chatScreen .chat-header strong {
        font-size: 14px;
      }

      #chatScreen .chat-header span {
        font-size: 12px;
      }

      #groupMessageInput,
      #messageInput {
        font-size: 14px;
      }

      #groupMessageForm .send-btn,
      #messageForm .send-btn {
        min-width: 42px;
      }

    }

  </style>

</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-card">

      <div class="brand">

        <div class="brand-icon">
          D
        </div>

        <div>

          <h1>
            Dark Chat
          </h1>

          <p>
            Private messaging
          </p>

        </div>

      </div>


      <!-- =================================================
           LOGIN
      ================================================== -->

      <form id="loginForm">

        <h2>
          Welcome back
        </h2>

        <p class="auth-subtitle">
          Sign in to continue
        </p>


        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Sign In
        </button>


        <div
          id="loginError"
          class="error"
          role="alert"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showRegister"
        >
          Create an account
        </button>

      </form>



      <!-- =================================================
           REGISTER
      ================================================== -->

      <form
        id="registerForm"
        class="hidden"
      >

        <h2>
          Create account
        </h2>

        <p class="auth-subtitle">
          Join Dark Chat
        </p>


        <div class="field">

          <label for="registerUsername">
            Username
          </label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >

        </div>


        <div class="field">

          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="registerPassword">
            Password
          </label>

          <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Create Account
        </button>


        <div
          id="registerError"
          class="error"
          role="alert"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showLogin"
        >
          Already have an account?
        </button>

      </form>

    </div>

  </section>



  <!-- =====================================================
       CHAT APP
  ====================================================== -->

  <section
    id="chatScreen"
    class="chat-screen hidden"
  >


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">


      <!-- =================================================
           MY PROFILE
      ================================================== -->

      <div class="sidebar-header">

        <div class="profile">

          <button
            id="myAvatarBtn"
            class="avatar-button"
            type="button"
            title="Profile"
            aria-label="Open profile"
          >

            <div
              id="myAvatar"
              class="avatar"
            >
              D
            </div>

          </button>


          <div class="profile-info">

            <strong id="myUsername">
              User
            </strong>

            <span>
              Online
            </span>

          </div>

        </div>


        <button
          id="logoutBtn"
          class="icon-btn"
          type="button"
          title="Logout"
          aria-label="Logout"
        >
          ⎋
        </button>

      </div>



      <!-- =================================================
           PEOPLE
      ================================================== -->

      <div class="sidebar-title">

        <span>
          People
        </span>

        <button
          id="refreshUsers"
          class="small-btn"
          type="button"
          title="Refresh"
          aria-label="Refresh people"
        >
          ↻
        </button>

      </div>


      <div
        id="usersList"
        class="users-list"
      >

        <div class="loading">
          Loading users...
        </div>

      </div>

    </aside>



    <!-- =================================================
         MAIN CHAT AREA
    ================================================== -->

    <main class="chat-area">


      <!-- =================================================
           GROUP CHAT
           This is the default chat after login.
      ================================================== -->

      <div
        id="groupChat"
        class="active-chat"
      >


        <!-- =================================================
             GROUP HEADER
        ================================================== -->

        <header class="chat-header">

          <div class="chat-user">

            <div
              id="groupAvatar"
              class="avatar"
              aria-hidden="true"
            >
              G
            </div>


            <div>

              <strong id="groupChatName">
                Group Chat
              </strong>

              <span id="groupChatStatus">
                Everyone
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadGroupMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
              aria-label="Refresh group messages"
            >
              ↻
            </button>

          </div>

        </header>



        <!-- =================================================
             GROUP MESSAGES
        ================================================== -->

        <div
          id="groupMessages"
          class="messages"
          aria-live="polite"
        ></div>



        <!-- =================================================
             GROUP MESSAGE FORM
        ================================================== -->

        <form
          id="groupMessageForm"
          class="message-form"
        >

          <input
            id="groupMessageInput"
            type="text"
            placeholder="Write a message to everyone..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >


          <button
            id="groupSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
            aria-label="Send group message"
          >
            ➤
          </button>

        </form>

      </div>



      <!-- =================================================
           PRIVATE CHAT
           Opened when a person is clicked.
      ================================================== -->

      <div
        id="privateChat"
        class="active-chat hidden"
      >


        <!-- =================================================
             PRIVATE CHAT HEADER
        ================================================== -->

        <header class="chat-header">

          <div class="chat-user">

            <div
              id="chatAvatar"
              class="avatar"
              aria-hidden="true"
            >
              U
            </div>


            <div>

              <strong id="chatUsername">
                User
              </strong>

              <span id="chatStatus">
                Offline
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
              aria-label="Refresh private messages"
            >
              ↻
            </button>

          </div>

        </header>



        <!-- =================================================
             PRIVATE MESSAGES
        ================================================== -->

        <div
          id="messages"
          class="messages"
          aria-live="polite"
        ></div>



        <!-- =================================================
             PRIVATE MESSAGE FORM
        ================================================== -->

        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >


          <button
            id="privateSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
            aria-label="Send private message"
          >
            ➤
          </button>

        </form>

      </div>



      <!-- =================================================
           EMPTY CHAT
      ================================================== -->

      <div
        id="emptyChat"
        class="empty-chat hidden"
      >

        <div class="empty-icon">
          ◇
        </div>

        <h2>
          Group Chat
        </h2>

        <p>
          Everyone can chat here.
        </p>

      </div>

    </main>

  </section>

</div>



<!-- =======================================================
     MY PROFILE PANEL
======================================================== -->

<div
  id="profilePanel"
  class="profile-panel hidden"
>

  <div
    class="profile-panel-backdrop"
    id="profilePanelBackdrop"
  ></div>


  <div class="profile-panel-card">

    <button
      id="closeProfilePanel"
      class="profile-close"
      type="button"
      title="Close"
      aria-label="Close profile"
    >
      ×
    </button>


    <button
      id="profilePhotoBtn"
      class="profile-photo-large-btn"
      type="button"
      title="Profile photo"
      aria-label="Profile photo"
    >

      <div
        id="profilePhotoLarge"
        class="profile-photo-large"
      >
        D
      </div>

    </button>


    <h3 id="profilePanelName">
      User
    </h3>


    <p id="profilePanelEmail">
      user@email.com
    </p>


    <input
      id="profilePhotoInput"
      type="file"
      accept="image/*"
      hidden
    >


    <div class="profile-actions">

      <button
        id="changeProfilePhoto"
        class="primary-btn"
        type="button"
      >
        Change Photo
      </button>


      <button
        id="removeProfilePhoto"
        class="secondary-btn"
        type="button"
      >
        Remove
      </button>

    </div>

  </div>

</div>



<!-- =======================================================
     TOAST
======================================================== -->

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>



<!-- =======================================================
     APP JAVASCRIPT
======================================================== -->

<script src="/app.js"></script>


</body>

</html>
