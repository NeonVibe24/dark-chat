<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section id="authScreen">

    <div id="loginBox">

      <h1>Private Chat</h1>

      <form id="loginForm">

        <input
          type="text"
          id="loginUsername"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          Login
        </button>

        <div
          id="loginError"
          class="error"
        ></div>

      </form>

      <div class="auth-switch">

        Don't have an account?

        <button
          type="button"
          id="showRegister"
        >
          Register
        </button>

      </div>

    </div>


    <div
      id="registerBox"
      class="hidden"
    >

      <h1>Create Account</h1>

      <form id="registerForm">

        <input
          type="text"
          id="registerUsername"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          autocomplete="new-password"
          required
        >

        <input
          type="password"
          id="registerPasswordConfirm"
          placeholder="Confirm Password"
          autocomplete="new-password"
          required
        >

        <button type="submit">
          Register
        </button>

        <div
          id="registerError"
          class="error"
        ></div>

      </form>

      <div class="auth-switch">

        Already have an account?

        <button
          type="button"
          id="showLogin"
        >
          Login
        </button>

      </div>

    </div>

  </section>



  <!-- =====================================================
       CHAT SCREEN
  ====================================================== -->

  <section
    id="chatScreen"
    class="hidden"
  >


    <!-- ===================================================
         GROUP CHAT
    ==================================================== -->

    <main
      id="groupChat"
      class="active-chat"
    >

      <header
        class="chat-header group-header"
      >

        <div class="chat-user">

          <div
            id="groupAvatar"
            class="avatar"
          >
            G
          </div>

          <div class="chat-user-info">

            <span
              id="groupChatName"
              class="chat-username"
            >
              Public Group
            </span>

            <span
              id="groupChatStatus"
              class="chat-status"
            >
              Group Chat
            </span>

          </div>

        </div>


        <div class="header-actions">

          <div class="my-profile">

            <button
              type="button"
              id="myAvatarBtn"
              title="Profile"
            >

              <div class="avatar">

                <img
                  id="myAvatar"
                  src=""
                  alt=""
                  class="hidden"
                >

                <span
                  id="myAvatarFallback"
                >
                  U
                </span>

              </div>

              <span
                id="profileNotificationBadge"
              ></span>

            </button>

            <span
              id="myUsername"
              class="hidden"
            ></span>

          </div>


          <button
            type="button"
            id="reloadGroupMessages"
            title="Refresh"
          >
            ↻
          </button>


          <button
            type="button"
            id="logoutBtn"
            title="Logout"
          >
            ⎋
          </button>

        </div>

      </header>


      <div
        id="groupMessages"
      ></div>


      <form
        id="groupMessageForm"
        class="message-form"
      >

        <input
          type="text"
          id="groupMessageInput"
          placeholder="Write a message..."
          autocomplete="off"
          maxlength="2000"
          required
        >

        <button type="submit">
          ➤
        </button>

      </form>

    </main>



    <!-- ===================================================
         PRIVATE CHAT
    ==================================================== -->

    <main
      id="privateChat"
      class="active-chat hidden"
    >

      <header
        class="chat-header private-chat-header"
      >

        <div
          class="chat-user"
        >

          <button
            type="button"
            id="privateBackBtn"
            class="private-back-btn"
            title="Back"
            aria-label="Back"
          >
            ←
          </button>


          <div
            id="chatAvatar"
            class="avatar"
          >

            <img
              id="chatAvatarImage"
              src=""
              alt=""
              class="hidden"
            >

            <span
              id="chatAvatarFallback"
            >
              U
            </span>

          </div>


          <div class="chat-user-info">

            <span
              id="chatUsername"
              class="chat-username"
            >
              User
            </span>

            <span
              id="chatStatus"
              class="chat-status"
            >
              Private Chat
            </span>

          </div>

        </div>


        <div class="header-actions">

          <button
            type="button"
            id="reloadMessages"
            title="Refresh"
          >
            ↻
          </button>

        </div>

      </header>


      <div
        id="messagesBox"
      ></div>


      <form
        id="messageForm"
        class="private-message-form"
      >

        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          autocomplete="off"
          maxlength="2000"
          required
        >

        <button type="submit">
          ➤
        </button>

      </form>

    </main>



    <!-- ===================================================
         EMPTY CHAT
    ==================================================== -->

    <section
      id="emptyChat"
      class="hidden"
    ></section>

  </section>



  <!-- =====================================================
       PROFILE PANEL
  ====================================================== -->

  <aside
    id="profilePanel"
    class="hidden"
  >

    <div class="profile-panel-header">

      <h3>
        Profile
      </h3>

      <button
        type="button"
        id="closeProfileBtn"
        class="icon-btn"
        title="Close"
      >
        ×
      </button>

    </div>


    <div class="profile-panel-info">

      <div id="profileAvatar">

        <img
          id="profileAvatarImage"
          src=""
          alt=""
          class="hidden"
        >

        <span
          id="profileAvatarFallback"
        >
          U
        </span>

      </div>


      <div
        id="profileUsername"
      >
        User
      </div>

    </div>


    <button
      type="button"
      id="editProfileBtn"
      class="edit-profile-btn"
    >
      Edit Profile
    </button>


    <!-- ===================================================
         PRIVATE INBOX
    ==================================================== -->

    <section
      id="privateInbox"
      class="private-inbox"
    >

      <div class="private-inbox-title">

        <span>
          Messages
        </span>

        <span
          id="privateInboxCount"
        >
          0
        </span>

      </div>


      <div
        id="privateUserList"
        class="private-user-list"
      ></div>


      <div
        id="privateInboxEmpty"
        class="private-inbox-empty hidden"
      >
        No messages yet.
      </div>

    </section>


    <!-- ===================================================
         PROFILE PHOTO
    ==================================================== -->

    <div class="profile-photo-actions">

      <label
        for="profilePhotoInput"
        class="profile-photo-button"
      >
        Change Photo

        <input
          type="file"
          id="profilePhotoInput"
          accept="image/*"
        >

      </label>


      <button
        type="button"
        id="removeProfilePhoto"
      >
        Remove
      </button>

    </div>

  </aside>



  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="hidden"
  ></div>


</div>



<script src="/app.js"></script>

</body>

</html>
