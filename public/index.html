<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b172a"
  >

  <title>Dark Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
    }

    /* =====================================================
       CHAT SCREEN
    ====================================================== */

    #chatScreen {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    #chatScreen.hidden {
      display: none !important;
    }


    /* =====================================================
       SIDEBAR
    ====================================================== */

    #chatScreen .sidebar {
      flex: 0 0 280px;
      width: 280px;
      min-width: 260px;
      max-width: 320px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* =====================================================
       MAIN CHAT AREA
    ====================================================== */

    #chatScreen .chat-area {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: flex !important;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }


    /* =====================================================
       ACTIVE CHAT
    ====================================================== */

    #chatScreen .active-chat {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chatScreen .active-chat.hidden {
      display: none !important;
    }


    /* =====================================================
       GROUP CHAT
    ====================================================== */

    #groupChat {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #groupChat.hidden {
      display: none !important;
    }


    /* =====================================================
       PRIVATE CHAT
    ====================================================== */

    #privateChat {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #privateChat.hidden {
      display: none !important;
    }


    /* =====================================================
       CHAT HEADER
    ====================================================== */

    #chatScreen .chat-header {
      flex: 0 0 auto;
      width: 100%;
      min-height: 64px;
      max-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* =====================================================
       MESSAGES
    ====================================================== */

    #chatScreen .messages {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      box-sizing: border-box;
    }


    /* =====================================================
       GROUP MESSAGE FORM
    ====================================================== */

    #groupMessageForm {
      flex: 0 0 auto !important;
      display: flex !important;
      align-items: center;
      width: 100%;
      min-height: 64px;
      padding: 10px 16px;
      box-sizing: border-box;
      position: relative;
      z-index: 5;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    #groupMessageInput {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      flex: 1 1 auto;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      box-sizing: border-box;
    }


    /* =====================================================
       PRIVATE MESSAGE FORM
    ====================================================== */

    #messageForm {
      flex: 0 0 auto !important;
      display: flex !important;
      align-items: center;
      width: 100%;
      min-height: 64px;
      padding: 10px 16px;
      box-sizing: border-box;
      position: relative;
      z-index: 5;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    #messageInput {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      flex: 1 1 auto;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      box-sizing: border-box;
    }


    /* =====================================================
       SEND BUTTON
    ====================================================== */

    #groupMessageForm .send-btn,
    #messageForm .send-btn {
      flex: 0 0 auto;
      cursor: pointer;
      height: 40px;
      min-width: 40px;
      margin-left: 8px;
    }


    /* =====================================================
       EMPTY CHAT
    ====================================================== */

    #emptyChat {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #emptyChat.hidden {
      display: none !important;
    }


    /* =====================================================
       PROFILE CLICKABLE AREA
    ====================================================== */

    .avatar-button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .avatar-button:active {
      transform: scale(0.97);
    }


    /* =====================================================
       GROUP PROFILE BUTTONS
    ====================================================== */

    .group-profile-button,
    .group-message-user,
    .group-message-sender {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .group-profile-button {
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .group-message-user,
    .group-message-sender {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
    }


    /* =====================================================
       GROUP MESSAGE STRUCTURE
    ====================================================== */

    .group-message-row {
      display: flex;
      width: 100%;
      box-sizing: border-box;
    }

    .group-message-avatar {
      flex: 0 0 auto;
    }

    .group-message-content {
      min-width: 0;
    }

    .group-message-sender {
      display: inline-block;
    }

    .group-message-bubble {
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .group-message-time {
      display: block;
    }


    /* =====================================================
       MOBILE RESPONSIVE FIX
    ====================================================== */

    @media (max-width: 800px) {

      #chatScreen .sidebar {
        flex: 0 0 90px;
        width: 90px;
        min-width: 90px;
        max-width: 90px;
      }

      #chatScreen .sidebar .profile-info,
      #chatScreen .sidebar .sidebar-title span,
      #chatScreen .users-list .user-info span {
        display: none !important;
      }

      #chatScreen .sidebar-header {
        padding: 10px;
        justify-content: center;
      }

      #chatScreen .sidebar-title {
        padding: 10px;
        justify-content: center;
      }

      #chatScreen .users-list .user-item {
        padding: 10px;
        justify-content: center;
      }

      #chatScreen .chat-area {
        flex: 1 1 auto;
        width: 0;
      }

      #groupMessageForm,
      #messageForm {
        padding: 8px;
        min-height: 56px;
      }

      #groupMessageInput,
      #messageInput {
        font-size: 14px;
        height: 36px;
      }

      #groupMessageForm .send-btn,
      #messageForm .send-btn {
        height: 36px;
        min-width: 36px;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ====================================================== */

    @media (max-width: 430px) {

      #chatScreen .sidebar {
        flex: 0 0 75px;
        width: 75px;
        min-width: 75px;
        max-width: 75px;
      }

    }

  </style>

</head>


<body>

<div id="app">


  <section
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-card">

      <div class="brand">

        <div class="brand-icon">
          D
        </div>

        <div>

          <h1>
            Dark Chat
          </h1>

          <p>
            Private messaging
          </p>

        </div>

      </div>


      <form id="loginForm">

        <h2>
          Welcome back
        </h2>

        <p class="auth-subtitle">
          Sign in to continue
        </p>


        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Sign In
        </button>


        <div
          id="loginError"
          class="error"
          role="alert"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showRegister"
        >
          Create an account
        </button>

      </form>



      <form
        id="registerForm"
        class="hidden"
      >

        <h2>
          Create account
        </h2>

        <p class="auth-subtitle">
          Join Dark Chat
        </p>


        <div class="field">

          <label for="registerUsername">
            Username
          </label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >

        </div>


        <div class="field">

          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="registerPassword">
            Password
          </label>

          <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Create Account
        </button>


        <div
          id="registerError"
          class="error"
          role="alert"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showLogin"
        >
          Already have an account?
        </button>

      </form>

    </div>

  </section>



  <section
    id="chatScreen"
    class="chat-screen hidden"
  >


    <aside class="sidebar">


      <div class="sidebar-header">

        <div class="profile">

          <button
            id="myAvatarBtn"
            class="avatar-button"
            type="button"
            title="Profile"
            aria-label="Open profile"
          >

            <div
              id="myAvatar"
              class="avatar"
            >
              D
            </div>

          </button>


          <div class="profile-info">

            <strong id="myUsername">
              User
            </strong>

            <span>
              Online
            </span>

          </div>

        </div>


        <button
          id="logoutBtn"
          class="icon-btn"
          type="button"
          title="Logout"
          aria-label="Logout"
        >
          ⎋
        </button>

      </div>



      <div class="sidebar-title">

        <span>
          People
        </span>

        <button
          id="refreshUsers"
          class="small-btn"
          type="button"
          title="Refresh"
          aria-label="Refresh people"
        >
          ↻
        </button>

      </div>


      <div
        id="usersList"
        class="users-list"
      >

        <div class="loading">
          Loading users...
        </div>

      </div>

    </aside>



    <main class="chat-area">


      <div
        id="groupChat"
        class="active-chat"
      >


        <header class="chat-header">

          <div class="chat-user">

            <div
              id="groupAvatar"
              class="avatar"
              aria-hidden="true"
            >
              G
            </div>


            <div>

              <strong id="groupChatName">
                Group Chat
              </strong>

              <span id="groupChatStatus">
                Everyone
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadGroupMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
              aria-label="Refresh group messages"
            >
              ↻
            </button>

          </div>

        </header>



        <div
          id="groupMessages"
          class="messages"
          aria-live="polite"
        ></div>



        <form
          id="groupMessageForm"
          class="message-form"
        >

          <input
            id="groupMessageInput"
            type="text"
            placeholder="Write a message to everyone..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >


          <button
            id="groupSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
            aria-label="Send group message"
          >
            ➤
          </button>

        </form>

      </div>



      <div
        id="privateChat"
        class="active-chat hidden"
      >


        <header class="chat-header">

          <div class="chat-user">

            <div
              id="chatAvatar"
              class="avatar"
              aria-hidden="true"
            >
              U
            </div>


            <div>

              <strong id="chatUsername">
                User
              </strong>

              <span id="chatStatus">
                Offline
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
              aria-label="Refresh private messages"
            >
              ↻
            </button>

          </div>

        </header>



        <div
          id="messages"
          class="messages"
          aria-live="polite"
        ></div>



        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >


          <button
            id="privateSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
            aria-label="Send private message"
          >
            ➤
          </button>

        </form>

      </div>



      <div
        id="emptyChat"
        class="empty-chat hidden"
      >

        <div class="empty-icon">
          ◇
        </div>

        <h2>
          Group Chat
        </h2>

        <p>
          Everyone can chat here.
        </p>

      </div>

    </main>

  </section>

</div>



<div
  id="profilePanel"
  class="profile-panel hidden"
>

  <div
    class="profile-panel-backdrop"
    id="profilePanelBackdrop"
  ></div>


  <div class="profile-panel-card">

    <button
      id="closeProfilePanel"
      class="profile-close"
      type="button"
      title="Close"
      aria-label="Close profile"
    >
      ×
    </button>


    <button
      id="profilePhotoBtn"
      class="profile-photo-large-btn"
      type="button"
      title="Profile photo"
      aria-label="Profile photo"
    >

      <div
        id="profilePhotoLarge"
        class="profile-photo-large"
      >
        D
      </div>

    </button>


    <h3 id="profilePanelName">
      User
    </h3>


    <p id="profilePanelEmail">
      user@email.com
    </p>


    <input
      id="profilePhotoInput"
      type="file"
      accept="image/*"
      hidden
    >


    <div class="profile-actions">

      <button
        id="changeProfilePhoto"
        class="primary-btn"
        type="button"
      >
        Change Photo
      </button>


      <button
        id="removeProfilePhoto"
        class="secondary-btn"
        type="button"
      >
        Remove
      </button>

    </div>

  </div>

</div>



<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>



<script>
  document.addEventListener('DOMContentLoaded', () => {
    const usersListContainer = document.getElementById('usersList');
    const groupChat = document.getElementById('groupChat');
    const privateChat = document.getElementById('privateChat');
    const chatUsername = document.getElementById('chatUsername');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatStatus = document.getElementById('chatStatus');

    // Sidebar ရဲ့ People အောက်မှာ Group Chat ကို ပြန်သွားဖို့ ခလုတ်တစ်ခုကို ထည့်သွင်းပေးခြင်း
    const sidebarTitle = document.querySelector('.sidebar-title');
    if (sidebarTitle && !document.getElementById('groupChatNavBtn')) {
      const navBtn = document.createElement('button');
      navBtn.id = 'groupChatNavBtn';
      navBtn.innerHTML = '👥 Group Chat';
      navBtn.style.cssText = 'display: block; width: calc(100% - 24px); margin: 8px 12px; padding: 8px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; font-weight: 500;';
      
      navBtn.addEventListener('click', () => {
        if (groupChat && privateChat) {
          privateChat.classList.add('hidden');
          groupChat.classList.remove('hidden');
        }
      });
      
      sidebarTitle.parentNode.insertBefore(navBtn, sidebarTitle.nextSibling);
    }

    // User တစ်ဦးချင်းစီကို နှိပ်လျှင် Private Chat သို့ ပြောင်းလဲပေးရန်
    if (usersListContainer) {
      usersListContainer.addEventListener('click', (e) => {
        const userItem = e.target.closest('.user-item') || e.target.closest('[data-user-id]') || e.target.closest('div');
        
        if (userItem && !userItem.closest('#myAvatarBtn')) {
          const userNameText = userItem.querySelector('strong, span')?.textContent || userItem.textContent.trim() || 'User';
          
          if (groupChat && privateChat) {
            groupChat.classList.add('hidden');
            privateChat.classList.remove('hidden');
            
            if (chatUsername) chatUsername.textContent = userNameText;
            if (chatAvatar) chatAvatar.textContent = userNameText.charAt(0).toUpperCase();
            if (chatStatus) chatStatus.textContent = 'Online';
          }
        }
      });
    }
  });
</script>

<script src="/app.js"></script>


</body>

</html>
