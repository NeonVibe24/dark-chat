<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dark Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH
  ====================================================== -->

  <section
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-card">

      <div class="brand">

        <div class="brand-icon">
          D
        </div>

        <div>

          <h1>
            Dark Chat
          </h1>

          <p>
            Private messaging
          </p>

        </div>

      </div>


      <!-- =================================================
           LOGIN
      ================================================== -->

      <form id="loginForm">

        <h2>
          Welcome back
        </h2>

        <p class="auth-subtitle">
          Sign in to continue
        </p>


        <div class="field">

          <label>
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label>
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Sign In
        </button>


        <div
          id="loginError"
          class="error"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showRegister"
        >
          Create an account
        </button>

      </form>



      <!-- =================================================
           REGISTER
      ================================================== -->

      <form
        id="registerForm"
        class="hidden"
      >

        <h2>
          Create account
        </h2>

        <p class="auth-subtitle">
          Join Dark Chat
        </p>


        <div class="field">

          <label>
            Username
          </label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >

        </div>


        <div class="field">

          <label>
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label>
            Password
          </label>

          <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Create Account
        </button>


        <div
          id="registerError"
          class="error"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showLogin"
        >
          Already have an account?
        </button>

      </form>

    </div>

  </section>



  <!-- =====================================================
       CHAT APP
  ====================================================== -->

  <section
    id="chatScreen"
    class="chat-screen hidden"
  >


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

      <!-- MY PROFILE -->

      <div class="sidebar-header">

        <div class="profile">

          <button
            id="myAvatarBtn"
            class="avatar-button"
            type="button"
            title="Profile"
          >

            <div
              id="myAvatar"
              class="avatar"
            >
              D
            </div>

          </button>


          <div class="profile-info">

            <strong id="myUsername">
              User
            </strong>

            <span>
              Online
            </span>

          </div>

        </div>


        <button
          id="logoutBtn"
          class="icon-btn"
          type="button"
          title="Logout"
        >
          ⎋
        </button>

      </div>



      <!-- =================================================
           USERS
      ================================================== -->

      <div class="sidebar-title">

        <span>
          People
        </span>

        <button
          id="refreshUsers"
          class="small-btn"
          type="button"
          title="Refresh"
        >
          ↻
        </button>

      </div>


      <div
        id="usersList"
        class="users-list"
      >

        <div class="loading">
          Loading users...
        </div>

      </div>

    </aside>



    <!-- =================================================
         MAIN CHAT AREA
    ================================================== -->

    <main class="chat-area">


      <!-- =================================================
           DEFAULT GROUP CHAT
      ================================================== -->

      <div
        id="groupChat"
        class="active-chat"
      >


        <!-- GROUP CHAT HEADER -->

        <header class="chat-header">

          <div class="chat-user">

            <div
              id="groupAvatar"
              class="avatar"
            >
              G
            </div>


            <div>

              <strong id="groupChatName">
                Group Chat
              </strong>

              <span id="groupChatStatus">
                Everyone
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadGroupMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
            >
              ↻
            </button>

          </div>

        </header>



        <!-- GROUP MESSAGES -->

        <div
          id="groupMessages"
          class="messages"
        ></div>



        <!-- GROUP MESSAGE FORM -->

        <form
          id="groupMessageForm"
          class="message-form"
        >

          <input
            id="groupMessageInput"
            type="text"
            placeholder="Write a message to everyone..."
            maxlength="5000"
            autocomplete="off"
          >


          <button
            class="send-btn"
            type="submit"
          >
            ➤
          </button>

        </form>

      </div>



      <!-- =================================================
           PRIVATE CHAT
      ================================================== -->

      <div
        id="privateChat"
        class="active-chat hidden"
      >


        <!-- PRIVATE CHAT HEADER -->

        <header class="chat-header">

          <div class="chat-user">

            <div
              id="chatAvatar"
              class="avatar"
            >
              U
            </div>


            <div>

              <strong id="chatUsername">
                User
              </strong>

              <span id="chatStatus">
                Offline
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
            >
              ↻
            </button>

          </div>

        </header>



        <!-- PRIVATE MESSAGES -->

        <div
          id="messages"
          class="messages"
        ></div>



        <!-- PRIVATE MESSAGE FORM -->

        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
          >


          <button
            class="send-btn"
            type="submit"
          >
            ➤
          </button>

        </form>

      </div>



      <!-- =================================================
           EMPTY CHAT
      ================================================== -->

      <div
        id="emptyChat"
        class="empty-chat hidden"
      >

        <div class="empty-icon">
          ◇
        </div>

        <h2>
          Group Chat
        </h2>

        <p>
          Everyone can chat here.
        </p>

      </div>

    </main>

  </section>

</div>



<!-- =======================================================
     MY PROFILE PANEL
======================================================== -->

<div
  id="profilePanel"
  class="profile-panel hidden"
>

  <div
    class="profile-panel-backdrop"
    id="profilePanelBackdrop"
  ></div>


  <div class="profile-panel-card">

    <button
      id="closeProfilePanel"
      class="profile-close"
      type="button"
      title="Close"
    >
      ×
    </button>


    <button
      id="profilePhotoBtn"
      class="profile-photo-large-btn"
      type="button"
      title="Profile photo"
    >

      <div
        id="profilePhotoLarge"
        class="profile-photo-large"
      >
        D
      </div>

    </button>


    <h3 id="profilePanelName">
      User
    </h3>


    <p id="profilePanelEmail">
      user@email.com
    </p>


    <input
      id="profilePhotoInput"
      type="file"
      accept="image/*"
      hidden
    >


    <div class="profile-actions">

      <button
        id="changeProfilePhoto"
        class="primary-btn"
        type="button"
      >
        Change Photo
      </button>


      <button
        id="removeProfilePhoto"
        class="secondary-btn"
        type="button"
      >
        Remove
      </button>

    </div>

  </div>

</div>



<!-- =======================================================
     TOAST
======================================================== -->

<div
  id="toast"
  class="toast"
></div>



<!-- =======================================================
     APP JAVASCRIPT
======================================================== -->

<script src="/app.js"></script>

</body>

</html>
