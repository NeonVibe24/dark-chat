<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #0b0f14;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .hidden {
      display: none !important;
    }


    /* =====================================================
       APP
    ===================================================== */

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }


    /* =====================================================
       AUTH
    ===================================================== */

    .auth-screen {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #18212d 0%,
          #0b0f14 55%,
          #070a0e 100%
        );
    }


    .auth-card {
      width: 100%;
      max-width: 420px;

      background: #111720;

      border: 1px solid #222c38;
      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);
    }


    .auth-card h1 {
      margin: 0 0 8px;

      text-align: center;

      font-size: 28px;
    }


    .auth-card > p {
      margin: 0 0 24px;

      text-align: center;

      color: #8e9aaa;

      font-size: 14px;
    }


    .auth-form {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }


    .auth-form input {
      width: 100%;
      height: 48px;

      padding: 0 15px;

      border-radius: 12px;

      border: 1px solid #2a3543;

      background: #0b1017;
      color: #fff;

      outline: none;

      font-size: 15px;
    }


    .auth-form input:focus {
      border-color: #4d8dff;
    }


    .auth-form button[type="submit"] {
      height: 48px;

      border: 0;
      border-radius: 12px;

      background: #3978ff;
      color: #fff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }


    .auth-form button[type="submit"]:active {
      transform: scale(0.98);
    }


    .auth-switch {
      margin-top: 18px !important;
      margin-bottom: 0 !important;
    }


    .auth-switch button {
      background: transparent;
      border: 0;

      color: #5d95ff;

      cursor: pointer;

      font-size: 14px;

      padding: 0;
    }


    .auth-switch button:hover {
      color: #83adff;
    }


    .auth-error {
      color: #ff6b6b !important;

      margin: 0 !important;

      text-align: left !important;

      font-size: 13px !important;
    }


    /* =====================================================
       CHAT SCREEN
    ===================================================== */

    .chat-screen {
      width: 100%;
      height: 100%;

      display: flex;

      background: #080c11;
    }


    .chat-area {
      width: 100%;
      height: 100%;

      min-width: 0;

      display: flex;
      flex-direction: column;

      position: relative;
    }


    /* =====================================================
       CHAT
    ===================================================== */

    .active-chat {
      width: 100%;
      height: 100%;

      min-height: 0;

      display: flex;
      flex-direction: column;

      background: #0b1016;
    }


    .active-chat.hidden {
      display: none !important;
    }


    /* =====================================================
       CHAT HEADER
    ===================================================== */

    .chat-header {
      width: 100%;
      min-height: 72px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 16px;

      background: #111821;

      border-bottom: 1px solid #202a35;
    }


    .chat-user {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 12px;
    }


    .chat-user-info {
      min-width: 0;
    }


    .chat-user-info h2 {
      margin: 0;

      font-size: 16px;
      font-weight: 650;

      color: #fff;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .chat-user-info p {
      margin: 3px 0 0;

      font-size: 12px;

      color: #8490a0;
    }


    /* =====================================================
       AVATAR
    ===================================================== */

    .avatar,
    .profile-avatar,
    .my-avatar {
      width: 44px;
      height: 44px;

      min-width: 44px;

      border-radius: 50%;

      overflow: hidden;

      background: #202a36;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      font-weight: 700;
      font-size: 16px;

      user-select: none;
    }


    .avatar img,
    .profile-avatar img,
    .my-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =====================================================
       GROUP HEADER
    ===================================================== */

    .group-header {
      min-height: 76px;
    }


    .group-header-right {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-left: auto;
    }


    .my-profile {
      display: flex;
      align-items: center;

      gap: 9px;

      min-width: 0;

      padding: 4px 8px 4px 5px;

      border-radius: 12px;
    }


    .my-profile-info {
      min-width: 0;

      max-width: 130px;
    }


    .my-profile-name {
      display: block;

      color: #fff;

      font-size: 13px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .my-profile-label {
      display: block;

      color: #778392;

      font-size: 11px;

      margin-top: 2px;
    }


    .my-avatar {
      width: 42px;
      height: 42px;

      min-width: 42px;

      cursor: pointer;

      border: 1px solid #344252;

      position: relative;
    }


    /* =====================================================
       HEADER BUTTONS
    ===================================================== */

    .header-actions {
      display: flex;
      align-items: center;

      gap: 6px;
    }


    .icon-btn {
      width: 40px;
      height: 40px;

      border: 0;
      border-radius: 11px;

      background: #1a232e;
      color: #dce3ec;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      font-size: 17px;
    }


    .icon-btn:hover {
      background: #24303d;
    }


    .icon-btn:active {
      transform: scale(0.95);
    }


    .logout-btn {
      width: auto;

      padding: 0 12px;

      font-size: 13px;
      font-weight: 600;

      color: #ff8585;
    }


    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 18px 18px 20px;

      display: flex;
      flex-direction: column;

      gap: 10px;

      scrollbar-width: thin;

      scrollbar-color:
        #2a3542
        transparent;
    }


    .messages::-webkit-scrollbar {
      width: 6px;
    }


    .messages::-webkit-scrollbar-track {
      background: transparent;
    }


    .messages::-webkit-scrollbar-thumb {
      background: #2a3542;

      border-radius: 10px;
    }


    /* =====================================================
       GROUP MESSAGE
    ===================================================== */

    .group-message {
      width: 100%;

      display: flex;
      align-items: flex-start;

      gap: 9px;
    }


    .group-message.mine {
      justify-content: flex-end;
    }


    .group-message.mine .message-content {
      align-items: flex-end;
    }


    .message-sender {
      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 4px;

      flex-shrink: 0;
    }


    .message-sender .avatar {
      width: 38px;
      height: 38px;

      min-width: 38px;

      cursor: pointer;

      border: 1px solid #2c3947;
    }


    .message-sender-name {
      max-width: 90px;

      color: #8793a2;

      font-size: 10px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      cursor: pointer;
    }


    .message-sender-name:hover {
      color: #5f98ff;
    }


    .message-content {
      max-width: min(75%, 600px);

      display: flex;

      flex-direction: column;

      align-items: flex-start;
    }


    .message-bubble {
      padding: 10px 13px;

      border-radius: 15px;

      background: #18212c;

      color: #e9edf2;

      font-size: 14px;

      line-height: 1.45;

      word-break: break-word;

      white-space: pre-wrap;
    }


    .mine .message-bubble {
      background: #2968e8;

      color: #fff;

      border-bottom-right-radius: 5px;
    }


    .group-message:not(.mine) .message-bubble {
      border-top-left-radius: 5px;
    }


    .message-time {
      margin-top: 4px;

      padding: 0 3px;

      color: #626e7d;

      font-size: 10px;
    }


    /* =====================================================
       PRIVATE MESSAGE
    ===================================================== */

    .private-message {
      width: 100%;

      display: flex;
    }


    .private-message.mine {
      justify-content: flex-end;
    }


    .private-message .message-content {
      max-width: min(75%, 600px);
    }


    /* =====================================================
       EMPTY CHAT
    ===================================================== */

    .empty-chat {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      color: #687585;

      background: #0b1016;
    }


    .empty-chat-inner {
      padding: 30px;
    }


    .empty-chat-inner h2 {
      margin: 0 0 8px;

      color: #d7dde5;

      font-size: 20px;
    }


    .empty-chat-inner p {
      margin: 0;

      color: #6d7988;

      font-size: 13px;
    }


    /* =====================================================
       MESSAGE COMPOSER
    ===================================================== */

    .message-form {
      width: 100%;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 10px 12px;

      background: #111821;

      border-top: 1px solid #202a35;
    }


    .message-input {
      flex: 1;

      min-width: 0;

      height: 46px;

      padding: 0 15px;

      border: 1px solid #293541;

      border-radius: 14px;

      background: #0b1017;

      color: #fff;

      outline: none;

      font-size: 14px;
    }


    .message-input:focus {
      border-color: #3978ff;
    }


    .message-input::placeholder {
      color: #657180;
    }


    .send-btn {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border: 0;

      border-radius: 14px;

      background: #3978ff;

      color: #fff;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 18px;
    }


    .send-btn:active {
      transform: scale(0.95);
    }


    /* =====================================================
       PROFILE PANEL
    ===================================================== */

    .profile-panel {
      position: fixed;

      top: 80px;
      right: 16px;

      width: 290px;

      max-height: calc(100vh - 95px);

      overflow-y: auto;

      background: #111821;

      border: 1px solid #293541;

      border-radius: 16px;

      padding: 18px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45);

      z-index: 100;
    }


    .profile-panel-header {
      display: flex;

      align-items: center;

      gap: 12px;
    }


    .profile-panel-info {
      min-width: 0;
    }


    .profile-panel-info h3 {
      margin: 0;

      color: #fff;

      font-size: 16px;
    }


    .profile-panel-info p {
      margin: 4px 0 0;

      color: #7f8b99;

      font-size: 12px;
    }


    .profile-panel-actions {
      display: flex;

      flex-direction: column;

      gap: 8px;

      margin-top: 18px;
    }


    .profile-panel-actions button {
      height: 42px;

      border: 1px solid #293541;

      border-radius: 10px;

      background: #18212b;

      color: #dce3ec;

      cursor: pointer;

      font-size: 13px;
    }


    .profile-panel-actions button:hover {
      background: #202b37;
    }


    .profile-panel-actions .danger {
      color: #ff7777;
    }


    /* =====================================================
       PRIVATE INBOX
    ===================================================== */

    .private-inbox {
      width: 100%;

      margin-top: 18px;

      padding-top: 16px;

      border-top: 1px solid #25303c;
    }


    .private-inbox-title {
      margin-bottom: 10px;

      color: #dce3ec;

      font-size: 13px;

      font-weight: 650;
    }


    .private-inbox-empty {
      padding: 12px 4px;

      color: #697585;

      font-size: 12px;

      text-align: center;
    }


    .private-inbox-item {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 9px;

      padding: 9px;

      margin: 0 0 5px;

      border: 0;

      border-radius: 11px;

      background: transparent;

      color: #fff;

      text-align: left;

      cursor: pointer;
    }


    .private-inbox-item:hover {
      background: #1a2430;
    }


    .private-inbox-avatar {
      width: 38px;
      height: 38px;

      min-width: 38px;

      border-radius: 50%;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #202a36;

      color: #fff;

      font-size: 14px;

      font-weight: 700;
    }


    .private-inbox-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .private-inbox-info {
      min-width: 0;

      flex: 1;
    }


    .private-inbox-username {
      color: #e9edf2;

      font-size: 13px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .private-inbox-preview {
      margin-top: 2px;

      color: #758191;

      font-size: 11px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .private-inbox-right {
      display: flex;

      flex-direction: column;

      align-items: flex-end;

      justify-content: center;

      gap: 3px;

      flex-shrink: 0;
    }


    .private-inbox-badge,
    .profile-unread-badge {
      min-width: 18px;

      height: 18px;

      padding: 0 5px;

      border-radius: 9px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      background: #3978ff;

      color: #fff;

      font-size: 10px;

      font-weight: 700;
    }


    .private-inbox-time {
      color: #5f6b7a;

      font-size: 9px;
    }


    .profile-unread-badge {
      position: absolute;

      top: -2px;
      right: -2px;

      border: 2px solid #111821;

      z-index: 2;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    #toast {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform: translateX(-50%);

      max-width: calc(100% - 30px);

      padding: 10px 16px;

      border-radius: 10px;

      background: #1b2430;

      border: 1px solid #303c4a;

      color: #fff;

      font-size: 13px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4);

      z-index: 9999;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .chat-header {
        min-height: 64px;

        padding: 8px 10px;
      }


      .group-header {
        min-height: 68px;
      }


      .chat-user {
        gap: 8px;
      }


      .avatar {
        width: 40px;
        height: 40px;

        min-width: 40px;
      }


      .chat-user-info h2 {
        font-size: 14px;
      }


      .chat-user-info p {
        font-size: 11px;
      }


      .my-profile {
        padding: 3px;
      }


      .my-profile-info {
        display: none;
      }


      .my-avatar {
        width: 38px;
        height: 38px;

        min-width: 38px;
      }


      .header-actions {
        gap: 4px;
      }


      .icon-btn {
        width: 36px;
        height: 36px;

        border-radius: 10px;
      }


      .logout-btn {
        width: 36px;

        padding: 0;

        font-size: 0;
      }


      .logout-btn::after {
        content: "↪";

        font-size: 18px;
      }


      .messages {
        padding: 14px 10px 16px;
      }


      .message-content,
      .private-message .message-content {
        max-width: 82%;
      }


      .message-sender .avatar {
        width: 34px;
        height: 34px;

        min-width: 34px;
      }


      .message-sender-name {
        max-width: 70px;
      }


      .message-bubble {
        font-size: 13px;

        padding: 9px 11px;
      }


      .message-form {
        padding: 8px;
      }


      .message-input {
        height: 44px;
      }


      .send-btn {
        width: 44px;
        height: 44px;

        min-width: 44px;
      }


      .profile-panel {
        top: 70px;
        right: 10px;

        width: calc(100% - 20px);
      }


      .auth-card {
        padding: 22px;
      }

    }


    @media (max-width: 380px) {

      .group-header-right {
        gap: 3px;
      }


      .header-actions .icon-btn {
        width: 34px;
        height: 34px;
      }


      .my-avatar {
        width: 35px;
        height: 35px;

        min-width: 35px;
      }

    }

  </style>

</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH
  ===================================================== -->

  <section
    id="authScreen"
    class="auth-screen"
  >

    <!-- LOGIN -->

    <div
      id="loginBox"
      class="auth-card"
    >

      <h1>Private Chat</h1>

      <p>
        Sign in to continue
      </p>


      <form
        id="loginForm"
        class="auth-form"
      >

        <input
          id="loginUsername"
          type="text"
          placeholder="Username"
          autocomplete="username"
          required
        >


        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >


        <p
          id="loginError"
          class="auth-error hidden"
        ></p>


        <button
          type="submit"
        >
          Login
        </button>

      </form>


      <p class="auth-switch">

        Don't have an account?

        <button
          id="showRegister"
          type="button"
        >
          Register
        </button>

      </p>

    </div>


    <!-- REGISTER -->

    <div
      id="registerBox"
      class="auth-card hidden"
    >

      <h1>
        Create Account
      </h1>

      <p>
        Register a new account
      </p>


      <form
        id="registerForm"
        class="auth-form"
      >

        <input
          id="registerUsername"
          type="text"
          placeholder="Username"
          autocomplete="username"
          minlength="3"
          required
        >


        <input
          id="registerPassword"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
          minlength="4"
          required
        >


        <input
          id="registerPasswordConfirm"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
          minlength="4"
          required
        >


        <p
          id="registerError"
          class="auth-error hidden"
        ></p>


        <button
          type="submit"
        >
          Register
        </button>

      </form>


      <p class="auth-switch">

        Already have an account?

        <button
          id="showLogin"
          type="button"
        >
          Login
        </button>

      </p>

    </div>

  </section>


  <!-- =====================================================
       CHAT SCREEN
  ===================================================== -->

  <section
    id="chatScreen"
    class="chat-screen hidden"
  >


    <!-- ===================================================
         MAIN CHAT AREA
    =================================================== -->

    <main class="chat-area">


      <!-- =================================================
           PUBLIC GROUP CHAT
      ================================================= -->

      <section
        id="groupChat"
        class="active-chat"
      >


        <!-- GROUP HEADER -->

        <header
          class="chat-header group-header"
        >


          <!-- GROUP -->

          <div class="chat-user">

            <div
              id="groupAvatar"
              class="avatar"
            >
              G
            </div>


            <div class="chat-user-info">

              <h2 id="groupChatName">
                Public Group Chat
              </h2>

              <p id="groupChatStatus">
                Everyone
              </p>

            </div>

          </div>


          <!-- MY PROFILE -->

          <div
            class="group-header-right"
          >


            <div
              id="myProfile"
              class="my-profile"
            >


              <button
                id="myAvatarBtn"
                class="my-avatar"
                type="button"
                title="Profile"
              >

                <img
                  id="myAvatar"
                  src=""
                  alt=""
                  class="hidden"
                >

                <span
                  id="myAvatarFallback"
                  class="avatar-fallback"
                  data-avatar-fallback
                >
                  U
                </span>

              </button>


              <div
                class="my-profile-info"
              >

                <span
                  id="myUsername"
                  class="my-profile-name"
                >
                  User
                </span>

                <span
                  class="my-profile-label"
                >
                  You
                </span>

              </div>

            </div>


            <!-- ACTIONS -->

            <div
              class="header-actions"
            >

              <button
                id="reloadGroupMessages"
                class="icon-btn"
                type="button"
                title="Refresh"
              >
                ↻
              </button>


              <button
                id="logoutBtn"
                class="icon-btn logout-btn"
                type="button"
                title="Logout"
              >
                Logout
              </button>

            </div>

          </div>

        </header>


        <!-- GROUP MESSAGES -->

        <div
          id="groupMessages"
          class="messages"
        ></div>


        <!-- GROUP COMPOSER -->

        <form
          id="groupMessageForm"
          class="message-form"
        >

          <input
            id="groupMessageInput"
            class="message-input"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
          >


          <button
            class="send-btn"
            type="submit"
            title="Send"
          >
            ➤
          </button>

        </form>

      </section>


      <!-- =================================================
           PRIVATE CHAT
      ================================================= -->

      <section
        id="privateChat"
        class="active-chat hidden"
      >


        <!-- PRIVATE HEADER -->

        <header
          class="chat-header"
        >

          <div
            class="chat-user"
          >

            <button
              id="chatAvatar"
              class="avatar"
              type="button"
            >

              <span
                id="chatAvatarFallback"
                class="avatar-fallback"
                data-avatar-fallback
              >
                U
              </span>


              <img
                id="chatAvatarImage"
                class="hidden"
                src=""
                alt=""
              >

            </button>


            <div
              class="chat-user-info"
            >

              <h2
                id="chatUsername"
              >
                User
              </h2>


              <p
                id="chatStatus"
              >
                Private Chat
              </p>

            </div>

          </div>


          <div
            class="header-actions"
          >

            <button
              id="reloadMessages"
              class="icon-btn"
              type="button"
              title="Refresh"
            >
              ↻
            </button>

          </div>

        </header>


        <!-- PRIVATE MESSAGES -->

        <div
          id="messagesBox"
          class="messages"
        ></div>


        <!-- PRIVATE COMPOSER -->

        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
          >


          <button
            class="send-btn"
            type="submit"
            title="Send"
          >
            ➤
          </button>

        </form>

      </section>


      <!-- =================================================
           EMPTY CHAT
      ================================================= -->

      <section
        id="emptyChat"
        class="empty-chat hidden"
      >

        <div
          class="empty-chat-inner"
        >

          <h2>
            Private Chat
          </h2>

          <p>
            Select a user from Public Group Chat
          </p>

        </div>

      </section>

    </main>


    <!-- ===================================================
         PROFILE PANEL
    =================================================== -->

    <div
      id="profilePanel"
      class="profile-panel hidden"
    >


      <div
        class="profile-panel-header"
      >

        <div
          id="profileAvatar"
          class="profile-avatar"
        >

          <img
            id="profileAvatarImage"
            src=""
            alt=""
            class="hidden"
          >

          <span
            id="profileAvatarFallback"
            class="avatar-fallback"
            data-avatar-fallback
          >
            U
          </span>

        </div>


        <div
          class="profile-panel-info"
        >

          <h3
            id="profileUsername"
          >
            User
          </h3>

          <p>
            Your profile
          </p>

        </div>

      </div>


      <div
        class="profile-panel-actions"
      >

        <label
          for="profilePhotoInput"
          style="
            height:42px;
            display:flex;
            align-items:center;
            justify-content:center;
            border:1px solid #293541;
            border-radius:10px;
            background:#18212b;
            color:#dce3ec;
            cursor:pointer;
            font-size:13px;
          "
        >
          Change Profile Photo
        </label>


        <input
          id="profilePhotoInput"
          type="file"
          accept="image/*"
          class="hidden"
        >


        <button
          id="removeProfilePhoto"
          type="button"
          class="danger"
        >
          Remove Profile Photo
        </button>

      </div>


      <!--
        #privateInbox
        နှင့် unread badge ကို
        app.js က အလိုအလျောက်ဖန်တီးပေးမယ်။
      -->

    </div>

  </section>


  <!-- =====================================================
       TOAST
  ===================================================== -->

  <div
    id="toast"
    class="hidden"
  ></div>


</div>


<!-- =======================================================
     APP JAVASCRIPT
======================================================= -->

<script src="/app.js"></script>


</body>

</html>
