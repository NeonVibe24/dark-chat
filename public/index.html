<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b172a"
  >

  <title>Dark Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    /* =====================================================
       BASE LAYOUT
    ====================================================== */

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }


    /* =====================================================
       CHAT SCREEN
    ====================================================== */

    #chatScreen {
      width: 100%;
      height: 100%;
      min-height: 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    #chatScreen.hidden {
      display: none !important;
    }


    /* =====================================================
       TOP BAR
    ====================================================== */

    #chatScreen .top-bar {
      flex: 0 0 auto;

      width: 100%;
      min-height: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        8px
        16px
        8px
        16px;

      box-sizing: border-box;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.08);

      background: inherit;

      position: relative;

      z-index: 20;
    }


    /* =====================================================
       TOP BAR LEFT
    ====================================================== */

    #chatScreen .top-bar-left {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 10px;
    }


    /* =====================================================
       TOP BAR BRAND
    ====================================================== */

    #chatScreen .top-bar-brand {
      display: flex;
      align-items: center;

      gap: 9px;

      min-width: 0;
    }

    #chatScreen .top-bar-brand strong {
      max-width: 220px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 16px;
    }

    #chatScreen .top-bar-brand span {
      font-size: 11px;

      opacity: 0.55;

      white-space: nowrap;
    }


    /* =====================================================
       TOP BAR RIGHT
    ====================================================== */

    #chatScreen .top-bar-right {
      flex: 0 0 auto;

      display: flex;

      align-items: center;

      gap: 8px;
    }


    /* =====================================================
       TOP BAR PROFILE
    ====================================================== */

    #chatScreen .top-profile {
      display: flex;

      align-items: center;

      gap: 8px;

      min-width: 0;
    }

    #chatScreen .top-profile-info {
      display: flex;

      flex-direction: column;

      min-width: 0;
    }

    #chatScreen .top-profile-info strong {
      max-width: 150px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 13px;
    }

    #chatScreen .top-profile-info span {
      margin-top: 1px;

      font-size: 10px;

      opacity: 0.55;
    }


    /* =====================================================
       TOP BAR BUTTONS
    ====================================================== */

    #chatScreen .top-bar .icon-btn {
      flex: 0 0 auto;
    }


    /* =====================================================
       MAIN CHAT AREA
    ====================================================== */

    #chatScreen .chat-area {
      flex: 1 1 auto;

      width: 100%;

      min-width: 0;
      min-height: 0;

      height: 0;

      display: flex !important;

      flex-direction: column;

      overflow: hidden;

      position: relative;
    }


    /* =====================================================
       ACTIVE CHAT
    ====================================================== */

    #chatScreen .active-chat {
      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;

      flex-direction: column;

      overflow: hidden;
    }

    #chatScreen .active-chat.hidden {
      display: none !important;
    }


    /* =====================================================
       GROUP / PRIVATE CHAT
    ====================================================== */

    #groupChat,
    #privateChat {
      display: flex;

      flex-direction: column;

      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      overflow: hidden;
    }

    #groupChat.hidden,
    #privateChat.hidden {
      display: none !important;
    }


    /* =====================================================
       CHAT HEADER
    ====================================================== */

    #chatScreen .chat-header {
      flex: 0 0 auto;

      width: 100%;

      min-height: 64px;
      height: 64px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      box-sizing: border-box;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.08);

      overflow: hidden;
    }

    #chatScreen .chat-user {
      min-width: 0;

      display: flex;

      align-items: center;

      gap: 10px;
    }

    #chatScreen .chat-user > div:last-child {
      min-width: 0;

      display: flex;

      flex-direction: column;
    }

    #chatScreen .chat-user strong {
      max-width: 300px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    #chatScreen .chat-user span {
      margin-top: 2px;

      font-size: 11px;

      opacity: 0.65;

      white-space: nowrap;
    }

    #chatScreen .chat-actions {
      flex: 0 0 auto;

      display: flex;

      align-items: center;

      gap: 6px;
    }


    /* =====================================================
       MESSAGES
    ====================================================== */

    #chatScreen .messages {
      flex: 1 1 auto;

      width: 100%;

      min-width: 0;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 16px;

      box-sizing: border-box;

      scroll-behavior: smooth;

      overscroll-behavior: contain;

      scrollbar-width: thin;
    }


    /* =====================================================
       GROUP MESSAGE
    ====================================================== */

    #groupMessages .message-row {
      width: 100%;

      min-width: 0;

      display: flex;

      align-items: flex-start;

      gap: 8px;

      margin-bottom: 10px;

      box-sizing: border-box;
    }

    #groupMessages .message-row.mine {
      justify-content: flex-end;
    }

    #groupMessages .avatar-button {
      flex: 0 0 auto;

      margin-top: 2px;
    }

    #groupMessages .group-message-content {
      min-width: 0;

      max-width: min(
        78%,
        600px
      );

      display: flex;

      flex-direction: column;

      align-items: flex-start;
    }

    #groupMessages .message-row.mine
    .group-message-content {
      align-items: flex-end;
    }

    #groupMessages .group-message-user {
      display: inline-block;

      max-width: 100%;

      margin: 0 0 3px;

      padding: 0;

      border: 0;

      background: transparent;

      color: inherit;

      font: inherit;

      font-size: 12px;

      font-weight: 600;

      opacity: 0.72;

      cursor: pointer;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    #groupMessages .group-message-user:hover {
      opacity: 1;
    }

    #groupMessages .message {
      max-width: 100%;

      word-break: break-word;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       CLICKABLE AVATAR
    ====================================================== */

    .avatar-button {
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      border: 0;

      background: transparent;

      padding: 0;

      flex: 0 0 auto;
    }

    .avatar-button:active {
      transform: scale(0.96);
    }


    /* =====================================================
       MESSAGE FORMS
    ====================================================== */

    #groupMessageForm,
    #messageForm {
      flex: 0 0 auto !important;

      display: flex !important;

      align-items: center;

      width: 100%;

      min-height: 64px;

      padding: 10px 16px;

      box-sizing: border-box;

      position: relative;

      z-index: 5;

      border-top:
        1px solid rgba(255, 255, 255, 0.08);

      gap: 8px;
    }


    /* =====================================================
       MESSAGE INPUT
    ====================================================== */

    #groupMessageInput,
    #messageInput {
      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      flex: 1 1 auto;

      width: 0;

      min-width: 0;

      height: 42px;

      padding: 0 13px;

      box-sizing: border-box;

      border-radius: 10px;

      outline: none;
    }

    #groupMessageInput::placeholder,
    #messageInput::placeholder {
      opacity: 0.55;
    }


    /* =====================================================
       SEND BUTTON
    ====================================================== */

    #groupMessageForm .send-btn,
    #messageForm .send-btn {
      flex: 0 0 42px;

      width: 42px;

      min-width: 42px;

      height: 42px;

      margin-left: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      border-radius: 10px;

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    #groupMessageForm .send-btn:active,
    #messageForm .send-btn:active {
      transform: scale(0.94);
    }


    /* =====================================================
       EMPTY CHAT
    ====================================================== */

    #emptyChat {
      width: 100%;
      height: 100%;

      min-height: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 24px;

      box-sizing: border-box;
    }

    #emptyChat.hidden {
      display: none !important;
    }


    /* =====================================================
       PROFILE PANEL
    ====================================================== */

    #profilePanel {
      z-index: 1000;
    }

    #profilePanel.hidden {
      display: none !important;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      #chatScreen .top-bar {
        min-height: 58px;

        height: 58px;

        padding:
          7px
          10px
          7px
          10px;
      }

      #chatScreen .top-bar-brand strong {
        max-width: 150px;

        font-size: 15px;
      }

      #chatScreen .top-bar-brand span {
        display: none;
      }

      #chatScreen .top-profile-info {
        display: none !important;
      }

      #chatScreen .top-bar-right {
        gap: 5px;
      }

      #chatScreen .chat-header {
        min-height: 60px;

        height: 60px;

        padding: 0 10px;
      }

      #chatScreen .chat-user {
        gap: 8px;
      }

      #chatScreen .chat-user strong {
        max-width: 190px;
      }

      #chatScreen .messages {
        padding: 12px;
      }

      #groupMessages .group-message-content {
        max-width: 82%;
      }

      #groupMessageForm,
      #messageForm {
        min-height: 58px;

        padding:
          8px
          8px
          calc(
            8px +
            env(safe-area-inset-bottom)
          );
      }

      #groupMessageInput,
      #messageInput {
        height: 38px;

        font-size: 14px;

        padding: 0 11px;
      }

      #groupMessageForm .send-btn,
      #messageForm .send-btn {
        flex-basis: 38px;

        width: 38px;

        min-width: 38px;

        height: 38px;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ====================================================== */

    @media (max-width: 430px) {

      #chatScreen .top-bar {
        padding-left: 7px;

        padding-right: 7px;
      }

      #chatScreen .top-bar-brand {
        gap: 6px;
      }

      #chatScreen .top-bar-brand strong {
        max-width: 125px;

        font-size: 14px;
      }

      #chatScreen .chat-header {
        padding-left: 8px;

        padding-right: 8px;
      }

      #chatScreen .chat-user strong {
        max-width: 155px;
      }

      #chatScreen .messages {
        padding: 10px;
      }

      #groupMessageForm,
      #messageForm {
        padding-left: 6px;

        padding-right: 6px;
      }

    }


    /* =====================================================
       EXTRA SMALL HEIGHT
    ====================================================== */

    @media (max-height: 520px) {

      #chatScreen .top-bar {
        min-height: 52px;

        height: 52px;
      }

      #chatScreen .chat-header {
        min-height: 54px;

        height: 54px;
      }

      #groupMessageForm,
      #messageForm {
        min-height: 52px;

        padding-top: 6px;

        padding-bottom: 6px;
      }

      #groupMessageInput,
      #messageInput,
      #groupMessageForm .send-btn,
      #messageForm .send-btn {
        height: 36px;
      }

    }


    /* =====================================================
       TOUCH DEVICES
    ====================================================== */

    @media (hover: none) {

      #groupMessages
      .group-message-user:hover {
        opacity: 0.72;
      }

    }

  </style>

</head>


<body>

<div id="app">


  <!-- =====================================================
       AUTH
  ====================================================== -->

  <section
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-card">


      <div class="brand">

        <div class="brand-icon">
          D
        </div>

        <div>

          <h1>
            Dark Chat
          </h1>

          <p>
            Private messaging
          </p>

        </div>

      </div>


      <!-- =================================================
           LOGIN
      ================================================== -->

      <form id="loginForm">

        <h2>
          Welcome back
        </h2>

        <p class="auth-subtitle">
          Sign in to continue
        </p>


        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Sign In
        </button>


        <div
          id="loginError"
          class="error"
          role="alert"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showRegister"
        >
          Create an account
        </button>

      </form>


      <!-- =================================================
           REGISTER
      ================================================== -->

      <form
        id="registerForm"
        class="hidden"
      >

        <h2>
          Create account
        </h2>

        <p class="auth-subtitle">
          Join Dark Chat
        </p>


        <div class="field">

          <label for="registerUsername">
            Username
          </label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            required
          >

        </div>


        <div class="field">

          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="registerPassword">
            Password
          </label>

          <input
            id="registerPassword"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Create Account
        </button>


        <div
          id="registerError"
          class="error"
          role="alert"
        ></div>


        <button
          type="button"
          class="switch-btn"
          id="showLogin"
        >
          Already have an account?
        </button>

      </form>

    </div>

  </section>



  <!-- =====================================================
       CHAT SCREEN
  ====================================================== -->

  <section
    id="chatScreen"
    class="chat-screen hidden"
  >


    <!-- ===================================================
         TOP BAR
    ==================================================== -->

    <header class="top-bar">


      <!-- =================================================
           TOP BAR LEFT
      ================================================== -->

      <div class="top-bar-left">

        <div class="top-bar-brand">

          <div
            class="brand-icon"
            aria-hidden="true"
          >
            D
          </div>

          <div>

            <strong>
              Dark Chat
            </strong>

            <span>
              Private messaging
            </span>

          </div>

        </div>

      </div>


      <!-- =================================================
           TOP BAR RIGHT
      ================================================== -->

      <div class="top-bar-right">


        <!-- ===============================================
             OWN PROFILE
        ================================================ -->

        <div class="top-profile">

          <button
            id="myAvatarBtn"
            class="avatar-button"
            type="button"
            title="Profile"
            aria-label="Open profile"
          >

            <div
              id="myAvatar"
              class="avatar"
            >
              D
            </div>

          </button>


          <div class="top-profile-info">

            <strong id="myUsername">
              User
            </strong>

            <span>
              Online
            </span>

          </div>

        </div>


        <!-- ===============================================
             GROUP CHAT BUTTON
        ================================================ -->

        <button
          id="groupChatNavBtn"
          class="icon-btn"
          type="button"
          title="Group Chat"
          aria-label="Open Group Chat"
        >
          👥
        </button>


        <!-- ===============================================
             LOGOUT
        ================================================ -->

        <button
          id="logoutBtn"
          class="icon-btn"
          type="button"
          title="Logout"
          aria-label="Logout"
        >
          ⎋
        </button>

      </div>

    </header>



    <!-- ===================================================
         CHAT AREA
    ==================================================== -->

    <main class="chat-area">


      <!-- ================================================
           PUBLIC GROUP CHAT
      ================================================= -->

      <div
        id="groupChat"
        class="active-chat"
      >


        <header class="chat-header">

          <div class="chat-user">

            <div
              id="groupAvatar"
              class="avatar"
              aria-hidden="true"
            >
              G
            </div>


            <div>

              <strong id="groupChatName">
                Public Group Chat
              </strong>

              <span id="groupChatStatus">
                Everyone
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadGroupMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
              aria-label="Refresh group messages"
            >
              ↻
            </button>

          </div>

        </header>


        <div
          id="groupMessages"
          class="messages"
          aria-live="polite"
        ></div>


        <form
          id="groupMessageForm"
          class="message-form"
        >

          <input
            id="groupMessageInput"
            type="text"
            placeholder="Write a message to everyone..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >


          <button
            id="groupSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
            aria-label="Send group message"
          >
            ➤
          </button>

        </form>

      </div>



      <!-- ================================================
           PRIVATE CHAT
      ================================================= -->

      <div
        id="privateChat"
        class="active-chat hidden"
      >


        <header class="chat-header">

          <div class="chat-user">

            <div
              id="chatAvatar"
              class="avatar"
              aria-hidden="true"
            >
              U
            </div>


            <div>

              <strong id="chatUsername">
                User
              </strong>

              <span id="chatStatus">
                Available
              </span>

            </div>

          </div>


          <div class="chat-actions">

            <button
              id="reloadMessages"
              class="icon-btn"
              type="button"
              title="Refresh messages"
              aria-label="Refresh private messages"
            >
              ↻
            </button>

          </div>

        </header>


        <div
          id="messages"
          class="messages"
          aria-live="polite"
        ></div>


        <form
          id="messageForm"
          class="message-form"
        >

          <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
            enterkeyhint="send"
          >


          <button
            id="privateSendBtn"
            class="send-btn"
            type="submit"
            title="Send"
            aria-label="Send private message"
          >
            ➤
          </button>

        </form>

      </div>



      <!-- ================================================
           EMPTY CHAT
      ================================================= -->

      <div
        id="emptyChat"
        class="empty-chat hidden"
      >

        <div class="empty-icon">
          ◇
        </div>

        <h2>
          Group Chat
        </h2>

        <p>
          Everyone can chat here.
        </p>

      </div>


    </main>

  </section>

</div>



<!-- =======================================================
     PROFILE PANEL
======================================================== -->

<div
  id="profilePanel"
  class="profile-panel hidden"
>


  <div
    class="profile-panel-backdrop"
    id="profilePanelBackdrop"
  ></div>


  <div class="profile-panel-card">


    <button
      id="closeProfilePanel"
      class="profile-close"
      type="button"
      title="Close"
      aria-label="Close profile"
    >
      ×
    </button>


    <button
      id="profilePhotoBtn"
      class="profile-photo-large-btn"
      type="button"
      title="Profile photo"
      aria-label="Profile photo"
    >

      <div
        id="profilePhotoLarge"
        class="profile-photo-large"
      >
        D
      </div>

    </button>


    <h3 id="profilePanelName">
      User
    </h3>


    <p id="profilePanelEmail">
      user@email.com
    </p>


    <input
      id="profilePhotoInput"
      type="file"
      accept="image/*"
      hidden
    >


    <div class="profile-actions">

      <button
        id="changeProfilePhoto"
        class="primary-btn"
        type="button"
      >
        Change Photo
      </button>


      <button
        id="removeProfilePhoto"
        class="secondary-btn"
        type="button"
      >
        Remove
      </button>

    </div>


  </div>

</div>



<!-- =======================================================
     TOAST
======================================================== -->

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>



<!-- =======================================================
     APP JAVASCRIPT
======================================================== -->

<script src="/app.js"></script>

</body>

</html>
