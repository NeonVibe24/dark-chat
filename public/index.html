    /* =====================================================
       SIDEBAR TITLE
    ====================================================== */

    #chatScreen .sidebar-title {
      flex: 0 0 auto;

    /* =====================================================
       GROUP CHAT NAVIGATION
    ====================================================== */

    #groupChatNavBtn {
      width: calc(100% - 24px);

    }

    #groupChatNavBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.13);
    }

    #groupChatNavBtn:active {
      transform: scale(0.98);
    }


    /* =====================================================
       USERS LIST
    ====================================================== */

    #usersList {
      flex: 1 1 auto;

      width: 100%;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      box-sizing: border-box;

      padding-bottom: 8px;

      scrollbar-width: thin;
    }

    #usersList .user-item {
      min-width: 0;
      box-sizing: border-box;

      transition:

    }

    #usersList .user-item:active {
      transform: scale(0.99);
    }

       MAIN CHAT AREA
    ====================================================== */

      display: flex !important;
      flex-direction: column;

      overflow: hidden;

      position: relative;
    }


    /* =====================================================
       ACTIVE CHAT
    ====================================================== */

    #chatScreen .active-chat {
      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    #chatScreen .active-chat.hidden {
      display: none !important;
    }


    /* =====================================================
       GROUP / PRIVATE CHAT
    ====================================================== */

    #groupChat,
    #privateChat {
      display: flex;

      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      overflow: hidden;
    }

    #groupChat.hidden,
    #privateChat.hidden {
      display: none !important;
    }


    /* =====================================================
       CHAT HEADER
    ====================================================== */

    #chatScreen .chat-header {

      overflow: hidden;
    }

    #chatScreen .chat-user {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 10px;
    }

      min-width: 0;

      display: flex;
      flex-direction: column;
    }

    #chatScreen .chat-user strong {
      max-width: 280px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

      margin-top: 2px;

      font-size: 11px;

      opacity: 0.65;

      white-space: nowrap;

      flex: 0 0 auto;

      align-items: center;

      gap: 6px;
    }


    /* =====================================================
       MESSAGES
    ====================================================== */

    #chatScreen .messages {

      min-width: 0;
      min-height: 0;

      overflow-x: hidden;

      padding: 16px;

      scroll-behavior: smooth;

      overscroll-behavior: contain;

      scrollbar-width: thin;
    }


    /* =====================================================
       MESSAGE FORMS
    ====================================================== */

    #groupMessageForm,
    #messageForm {
      flex: 0 0 auto !important;

      padding: 10px 16px;

      position: relative;

      z-index: 5;

      border-top: 1px solid rgba(255, 255, 255, 0.08);

       MESSAGE INPUT

  document.addEventListener('DOMContentLoaded', () => {

    const usersListContainer =
      document.getElementById('usersList');

    const groupChat =
      document.getElementById('groupChat');

    const privateChat =
      document.getElementById('privateChat');

    const chatUsername =
      document.getElementById('chatUsername');

    const chatAvatar =
      document.getElementById('chatAvatar');

    const chatStatus =
      document.getElementById('chatStatus');


    /* =====================================================
       GROUP CHAT NAVIGATION
       UI ONLY — does not change app.js logic
    ====================================================== */

    const navBtn =
      document.getElementById('groupChatNavBtn');

    if (navBtn) {

      navBtn.addEventListener('click', () => {

        if (groupChat && privateChat) {

          privateChat.classList.add('hidden');

          groupChat.classList.remove('hidden');

        }

      });

    }


    /* =====================================================
       PRIVATE CHAT NAVIGATION
       UI ONLY
    ====================================================== */

    if (usersListContainer) {

      usersListContainer.addEventListener('click', (e) => {

        const userItem =
          e.target.closest('.user-item');

        if (!userItem) {
          return;
        }

        if (userItem.closest('#myAvatarBtn')) {
          return;
        }

        const userNameElement =
          userItem.querySelector('strong');

        const userNameText =
          userNameElement
            ? userNameElement.textContent.trim()
            : 'User';


        if (groupChat && privateChat) {

          groupChat.classList.add('hidden');

          privateChat.classList.remove('hidden');


          if (chatUsername) {
            chatUsername.textContent =
              userNameText || 'User';
          }


          if (chatAvatar) {

            chatAvatar.textContent =
              (userNameText || 'U')
                .charAt(0)
                .toUpperCase();

          }


          if (chatStatus) {
            chatStatus.textContent = 'Online';
          }

        }

      });

    }

  });
</script><script src="/app.js"></script></body></html>
