<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Chat</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #0b1016;
      color: #ffffff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================================
       APP
    ========================================================= */

    #app {
      width: 100%;
      height: 100%;
      min-height: 100vh;
    }


    /* =========================================================
       AUTH
    ========================================================= */

    #authScreen {
      width: 100%;
      height: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #17222f 0%,
          #0b1016 45%,
          #080c11 100%
        );
    }

    .auth-box {
      width: 100%;
      max-width: 390px;

      background: #111821;

      border: 1px solid #263341;
      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .45);
    }

    .auth-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #8793a1;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .auth-input {
      width: 100%;
      height: 48px;

      border: 1px solid #2b3948;
      border-radius: 12px;

      background: #0c131b;
      color: #ffffff;

      padding: 0 14px;

      outline: none;
    }

    .auth-input:focus {
      border-color: #4b627a;
    }

    .auth-button {
      width: 100%;
      height: 48px;

      border: 0;
      border-radius: 12px;

      background: #ffffff;
      color: #0b1016;

      font-weight: 700;

      margin-top: 4px;
    }

    .auth-switch {
      border: 0;
      background: transparent;

      color: #9caaba;

      margin-top: 18px;
      width: 100%;

      font-size: 14px;
    }

    .auth-switch:hover {
      color: #ffffff;
    }


    /* =========================================================
       CHAT SCREEN
    ========================================================= */

    #chatScreen {
      width: 100%;
      height: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      background: #0b1016;
    }

    .chat-area {
      width: 100%;
      height: 100%;
      min-height: 0;

      display: flex;
      flex-direction: column;
    }


    /* =========================================================
       CHAT VIEW
    ========================================================= */

    #groupChat,
    #privateChat {
      width: 100%;
      height: 100%;
      min-height: 0;

      display: flex;
      flex-direction: column;
    }


    /* =========================================================
       CHAT HEADER
    ========================================================= */

    .chat-header {
      width: 100%;
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 10px 14px;

      background: #111821;

      border-bottom: 1px solid #25313e;

      flex-shrink: 0;
    }

    .chat-user {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .chat-user-info {
      min-width: 0;
    }

    .chat-username {
      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-status {
      margin-top: 3px;

      color: #7f8b99;

      font-size: 12px;
    }


    /* =========================================================
       GROUP HEADER
    ========================================================= */

    .group-header {
      min-height: 70px;
    }

    .group-info {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .group-info-text {
      min-width: 0;
    }

    .group-name {
      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-status {
      margin-top: 3px;

      color: #7f8b99;

      font-size: 12px;
    }


    /* =========================================================
       AVATARS
    ========================================================= */

    .avatar-button {
      width: 44px;
      height: 44px;

      min-width: 44px;

      border: 0;
      border-radius: 50%;

      overflow: hidden;

      background: #202c39;

      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-button img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;
      font-weight: 700;

      color: #ffffff;
    }

    .group-avatar {
      width: 44px;
      height: 44px;

      min-width: 44px;

      border-radius: 50%;

      background: #202c39;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .group-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* =========================================================
       HEADER ACTIONS
    ========================================================= */

    .header-actions {
      display: flex;
      align-items: center;

      gap: 7px;

      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      min-width: 40px;

      border: 1px solid #2a3745;
      border-radius: 11px;

      background: #151e28;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;
    }

    .icon-btn:hover {
      background: #1d2936;
      border-color: #3a4b5d;
    }

    .private-back-btn {
      width: 40px;
      height: 40px;

      min-width: 40px;

      border-radius: 11px;

      font-size: 23px;
      font-weight: 400;

      line-height: 1;
    }


    /* =========================================================
       MY PROFILE HEADER
    ========================================================= */

    .my-profile {
      display: flex;
      align-items: center;

      gap: 8px;

      min-width: 0;
    }

    .my-profile-info {
      min-width: 0;

      max-width: 130px;
    }

    .my-username {
      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-avatar-wrap {
      position: relative;

      width: 42px;
      height: 42px;

      min-width: 42px;
    }

    #myAvatarBtn {
      width: 42px;
      height: 42px;

      min-width: 42px;
    }

    #profileNotificationBadge {
      position: absolute;

      right: -3px;
      top: -4px;

      min-width: 19px;
      height: 19px;

      padding: 0 5px;

      border-radius: 10px;

      background: #e5484d;
      color: #ffffff;

      border: 2px solid #111821;

      display: none;

      align-items: center;
      justify-content: center;

      font-size: 10px;
      font-weight: 700;

      line-height: 1;
    }


    /* =========================================================
       MESSAGES
    ========================================================= */

    .messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 18px;

      display: flex;
      flex-direction: column;

      gap: 8px;

      background: #0b1016;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #263340;
      border-radius: 10px;
    }


    /* =========================================================
       GROUP MESSAGE
    ========================================================= */

    .group-message {
      width: 100%;

      display: flex;
      align-items: flex-start;

      gap: 9px;

      padding: 8px 6px;

      border-radius: 12px;
    }

    .group-message:hover {
      background: rgba(255,255,255,.025);
    }

    .group-message-avatar {
      width: 38px;
      height: 38px;

      min-width: 38px;

      border-radius: 50%;

      overflow: hidden;

      background: #202c39;

      border: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
    }

    .group-message-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .group-message-content {
      min-width: 0;
      flex: 1;
    }

    .group-message-top {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 3px;
    }

    .group-message-name {
      font-size: 13px;
      font-weight: 700;
    }

    .group-message-time {
      color: #687584;
      font-size: 10px;
    }

    .group-message-text {
      color: #d9e0e7;

      font-size: 14px;
      line-height: 1.5;

      word-break: break-word;
      white-space: pre-wrap;
    }


    /* =========================================================
       PRIVATE MESSAGE
    ========================================================= */

    .private-message {
      width: 100%;

      display: flex;

      margin: 2px 0;
    }

    .private-message.mine {
      justify-content: flex-end;
    }

    .private-message.theirs {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: min(75%, 620px);

      padding: 10px 13px;

      border-radius: 15px;

      font-size: 14px;
      line-height: 1.45;

      word-break: break-word;
      white-space: pre-wrap;
    }

    .private-message.mine .message-bubble {
      background: #ffffff;
      color: #0b1016;

      border-bottom-right-radius: 5px;
    }

    .private-message.theirs .message-bubble {
      background: #17212c;
      color: #e3e8ed;

      border: 1px solid #263442;

      border-bottom-left-radius: 5px;
    }

    .message-time {
      display: block;

      margin-top: 4px;

      font-size: 9px;

      opacity: .55;

      text-align: right;
    }


    /* =========================================================
       MESSAGE FORM
    ========================================================= */

    .message-form {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 10px 12px;

      background: #111821;

      border-top: 1px solid #25313e;

      flex-shrink: 0;
    }

    .message-input {
      flex: 1;

      min-width: 0;

      height: 46px;

      border: 1px solid #2a3745;
      border-radius: 13px;

      background: #0b1219;
      color: #ffffff;

      padding: 0 14px;

      outline: none;
    }

    .message-input:focus {
      border-color: #465b70;
    }

    .message-input::placeholder {
      color: #687584;
    }

    .send-button {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border: 0;
      border-radius: 13px;

      background: #ffffff;
      color: #0b1016;

      font-size: 18px;
      font-weight: 700;
    }


    /* =========================================================
       EMPTY CHAT
    ========================================================= */

    #emptyChat {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b1016;
    }

    .empty-chat-content {
      text-align: center;

      padding: 30px;
    }

    .empty-chat-title {
      font-size: 20px;
      font-weight: 700;

      margin-bottom: 7px;
    }

    .empty-chat-text {
      color: #778493;

      font-size: 13px;
    }


    /* =========================================================
       PROFILE PANEL
    ========================================================= */

    .profile-panel {
      position: fixed;

      top: 76px;
      right: 14px;

      width: 360px;
      max-width: calc(100vw - 28px);

      max-height: calc(100vh - 90px);

      overflow-y: auto;

      background: #111821;

      border: 1px solid #293744;
      border-radius: 18px;

      padding: 16px;

      box-shadow:
        0 24px 70px rgba(0,0,0,.55);

      z-index: 100;
    }

    .profile-panel::-webkit-scrollbar {
      width: 5px;
    }

    .profile-panel::-webkit-scrollbar-thumb {
      background: #293744;
      border-radius: 10px;
    }


    /* =========================================================
       PROFILE HEADER
    ========================================================= */

    .profile-panel-header {
      display: flex;
      align-items: center;

      gap: 12px;

      padding-bottom: 14px;

      border-bottom: 1px solid #26323e;
    }

    .profile-large-avatar {
      width: 58px;
      height: 58px;

      min-width: 58px;

      border-radius: 50%;

      overflow: hidden;

      background: #202c39;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-large-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .profile-large-avatar-fallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      font-weight: 700;
    }

    .profile-name-area {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-label {
      margin-top: 4px;

      color: #73808e;

      font-size: 12px;
    }


    /* =========================================================
       EDIT PROFILE
    ========================================================= */

    #editProfileBtn {
      width: 100%;
      height: 42px;

      margin-top: 14px;

      border: 1px solid #2b3947;
      border-radius: 11px;

      background: #151e28;
      color: #ffffff;

      font-size: 13px;
      font-weight: 600;
    }

    #editProfileBtn:hover {
      background: #1c2834;
    }


    /* =========================================================
       PRIVATE INBOX
    ========================================================= */

    .private-inbox {
      margin-top: 18px;
    }

    .private-inbox-title {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 9px;
    }

    .private-inbox-title-text {
      font-size: 14px;
      font-weight: 700;
    }

    #privateInboxCount {
      min-width: 22px;
      height: 20px;

      padding: 0 7px;

      border-radius: 10px;

      background: #263442;
      color: #dce4eb;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 10px;
      font-weight: 700;
    }


    /* =========================================================
       PRIVATE USER LIST
    ========================================================= */

    .private-user-list {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 7px;

      max-height: 390px;

      overflow-y: auto;

      padding-right: 2px;
    }

    .private-user-list::-webkit-scrollbar {
      width: 5px;
    }

    .private-user-list::-webkit-scrollbar-thumb {
      background: #293744;
      border-radius: 10px;
    }

    .private-user-item {
      width: 100%;
      min-height: 68px;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 9px 10px;

      border: 1px solid #202d39;
      border-radius: 13px;

      background: #151e28;

      color: #ffffff;

      text-align: left;

      appearance: none;
      outline: none;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .private-user-item:hover {
      background: #1a2631;
      border-color: #304150;
    }

    .private-user-item:active {
      background: #1d2a36;
    }


    /* =========================================================
       INBOX AVATAR
    ========================================================= */

    .private-user-avatar {
      width: 45px;
      height: 45px;

      min-width: 45px;

      border-radius: 50%;

      overflow: hidden;

      background: #202c39;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .private-user-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .private-user-avatar-fallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: 700;
    }


    /* =========================================================
       INBOX USER INFO
    ========================================================= */

    .private-user-info {
      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 4px;
    }

    .private-user-name-row {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 7px;
    }

    .private-user-name {
      min-width: 0;

      flex: 1;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .private-user-time {
      color: #6d7a88;

      font-size: 9px;

      flex-shrink: 0;
    }

    .private-user-preview {
      min-width: 0;

      color: #7f8b98;

      font-size: 11px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================================================
       UNREAD BADGE
    ========================================================= */

    .private-unread-badge {
      min-width: 21px;
      height: 21px;

      padding: 0 6px;

      border-radius: 11px;

      background: #e5484d;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 10px;
      font-weight: 700;

      flex-shrink: 0;
    }


    /* =========================================================
       EMPTY INBOX
    ========================================================= */

    #privateInboxEmpty {
      padding: 18px 10px;

      text-align: center;

      color: #6f7c89;

      font-size: 12px;

      border: 1px dashed #283541;
      border-radius: 12px;

      background: #0e151d;
    }


    /* =========================================================
       PROFILE ACTIONS
    ========================================================= */

    .profile-panel-actions {
      display: flex;

      gap: 8px;

      margin-top: 14px;

      padding-top: 14px;

      border-top: 1px solid #26323e;
    }

    .profile-action-button {
      flex: 1;

      min-width: 0;

      height: 40px;

      border: 1px solid #2b3947;
      border-radius: 10px;

      background: #151e28;
      color: #ffffff;

      font-size: 12px;
    }

    .profile-action-button:hover {
      background: #1c2834;
    }

    #removePhotoBtn {
      color: #e5a1a4;
    }

    #profilePhotoInput {
      display: none;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      body {
        overflow: hidden;
      }

      .chat-header {
        min-height: 64px;

        padding: 8px 9px;

        gap: 7px;
      }

      .group-header {
        min-height: 64px;
      }

      .avatar-button,
      .group-avatar {
        width: 40px;
        height: 40px;

        min-width: 40px;
      }

      .profile-avatar-wrap,
      #myAvatarBtn {
        width: 39px;
        height: 39px;

        min-width: 39px;
      }

      .chat-user {
        gap: 7px;
      }

      .chat-username,
      .group-name {
        font-size: 14px;
      }

      .chat-status,
      .group-status {
        font-size: 10px;
      }

      .header-actions {
        gap: 5px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;

        min-width: 36px;

        border-radius: 10px;
      }

      .private-back-btn {
        width: 36px;
        height: 36px;

        min-width: 36px;

        font-size: 21px;
      }

      .my-profile-info {
        display: none;
      }

      .messages {
        padding: 12px 9px;
      }

      .group-message {
        padding: 7px 3px;
      }

      .group-message-avatar {
        width: 34px;
        height: 34px;

        min-width: 34px;
      }

      .group-message-text {
        font-size: 13px;
      }

      .message-bubble {
        max-width: 82%;

        font-size: 13px;
      }

      .message-form {
        padding: 8px;
      }

      .message-input {
        height: 44px;
      }

      .send-button {
        width: 44px;
        height: 44px;

        min-width: 44px;
      }


      /* ---------------------------------------------
         PROFILE MOBILE
      --------------------------------------------- */

      .profile-panel {
        top: 64px;
        right: 8px;
        left: 8px;

        width: auto;
        max-width: none;

        max-height: calc(100vh - 72px);

        padding: 14px;

        border-radius: 17px;
      }

      .private-user-list {
        max-height: calc(100vh - 360px);
      }

      .private-user-item {
        min-height: 66px;

        padding: 8px;
      }

      .private-user-avatar {
        width: 43px;
        height: 43px;

        min-width: 43px;
      }

      .profile-large-avatar {
        width: 54px;
        height: 54px;

        min-width: 54px;
      }

    }


    /* =========================================================
       VERY SMALL SCREENS
    ========================================================= */

    @media (max-width: 380px) {

      .chat-header {
        padding-left: 7px;
        padding-right: 7px;
      }

      .header-actions {
        gap: 3px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;

        min-width: 34px;
      }

      .private-back-btn {
        width: 34px;
        height: 34px;

        min-width: 34px;
      }

      .avatar-button,
      .group-avatar {
        width: 38px;
        height: 38px;

        min-width: 38px;
      }

    }

  </style>

</head>


<body>

<div id="app">


  <!-- =========================================================
       AUTH SCREEN
  ========================================================= -->

  <section id="authScreen">

    <!-- LOGIN -->

    <div
      id="loginBox"
      class="auth-box"
    >

      <div class="auth-title">
        Private Chat
      </div>

      <div class="auth-subtitle">
        Sign in to continue
      </div>

      <form
        id="loginForm"
        class="auth-form"
      >

        <input
          id="loginUsername"

<!-- =========================================================
     AUTH SWITCH
========================================================= -->

<script>

  (function () {

    const loginBox =
      document.getElementById("loginBox");

    const registerBox =
      document.getElementById("registerBox");

    const showRegisterBtn =
      document.getElementById("showRegisterBtn");

    const showLoginBtn =
      document.getElementById("showLoginBtn");


    if (showRegisterBtn) {

      showRegisterBtn.addEventListener(
        "click",
        function () {

          loginBox.classList.add("hidden");

          registerBox.classList.remove("hidden");

        }
      );

    }


    if (showLoginBtn) {

      showLoginBtn.addEventListener(
        "click",
        function () {

          registerBox.classList.add("hidden");

          loginBox.classList.remove("hidden");

        }
      );

    }

  })();

</script>



<!-- =========================================================
     PRIVATE CHAT BACK BUTTON
========================================================= -->

<script>

  (function () {

    const backButton =
      document.getElementById("privateBackBtn");

    if (!backButton) {
      return;
    }


    backButton.addEventListener(
      "click",
      function () {


        /*
          If app.js already provides a public
          showGroupChat() function, use it.
        */

        if (
          typeof window.showGroupChat === "function"
        ) {

          window.showGroupChat();

          return;

        }


        /*
          Fallback DOM switching.
        */

        const privateChat =
          document.getElementById("privateChat");

        const groupChat =
          document.getElementById("groupChat");

        const emptyChat =
          document.getElementById("emptyChat");


        if (privateChat) {
          privateChat.classList.add("hidden");
        }

        if (emptyChat) {
          emptyChat.classList.add("hidden");
        }

        if (groupChat) {
          groupChat.classList.remove("hidden");
        }

      }
    );

  })();

</script>
