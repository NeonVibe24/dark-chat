<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dark Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#070b14;--card:#101725;--card2:#151e2d;--primary:#7c5cff;--primary2:#6244e8;--text:#f5f7ff;--muted:#8d98ab;--border:rgba(255,255,255,.08);--danger:#ff5c70;--success:#20d99a;}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.app{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{width:100%;max-width:380px;}
.logo{width:68px;height:68px;border-radius:22px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8b6cff,#6040e8);font-size:30px;}
.title{text-align:center;font-size:28px;font-weight:800;}
.subtitle{text-align:center;color:var(--muted);margin-top:8px;margin-bottom:30px;font-size:14px;}
.form{background:rgba(16,23,37,.88);border:1px solid var(--border);border-radius:26px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.35);}
.input-group{margin-bottom:15px;}
.input-group label{display:block;color:#aeb8c9;font-size:13px;margin-bottom:8px;}
.input{width:100%;height:52px;border:1px solid var(--border);outline:none;border-radius:15px;background:#0b111d;color:white;padding:0 16px;font-size:15px;}
.main-btn{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-size:15px;font-weight:700;cursor:pointer;}
.message{display:none;margin-bottom:15px;padding:12px 14px;border-radius:12px;font-size:13px;}
.message.error{display:block;background:rgba(255,92,112,.10);color:#ff8796;border:1px solid rgba(255,92,112,.15);}
.message.success{display:block;background:rgba(32,217,154,.10);color:#58e6b5;border:1px solid rgba(32,217,154,.15);}
.chat-page{display:none;min-height:100vh;background:var(--bg);}
.chat-header{height:76px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.chat-content{padding:18px;}
.search{width:100%;height:48px;border:1px solid var(--border);border-radius:15px;background:#101725;color:white;outline:none;padding:0 15px;margin-bottom:20px;}
.user-list{display:flex;flex-direction:column;gap:8px;}
.user{display:flex;align-items:center;gap:13px;padding:12px;border-radius:17px;cursor:pointer;}
.avatar{width:50px;height:50px;border-radius:17px;background:#343e55;display:flex;align-items:center;justify-content:center;font-weight:700;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="app">
    <section class="auth-page" id="authPage">
        <div class="auth-box">
            <div class="logo">💬</div>
            <div class="title" id="authTitle">Welcome Back</div>
            <div class="subtitle" id="authSubtitle">Sign in to continue chatting</div>
            <div class="form">
                <div class="message" id="message"></div>
                <div class="input-group hidden" id="usernameGroup">
                    <label>Username</label>
                    <input class="input" id="username" type="text" placeholder="Enter username" maxlength="30">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input class="input" id="email" type="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input class="input" id="password" type="password" placeholder="Enter password">
                </div>
                <button class="main-btn" id="authButton">Sign In</button>
                <div class="switch" style="text-align:center;margin-top:20px;font-size:14px;color:var(--muted);">
                    <span id="switchText">Don't have an account?</span>
                    <button type="button" id="switchButton" style="border:0;background:none;color:#9c88ff;font-weight:700;cursor:pointer;">Create account</button>
                </div>
            </div>
        </div>
    </section>

    <section class="chat-page" id="chatPage">
        <header class="chat-header">
            <div><b>Messages</b></div>
            <button id="logoutButton" style="padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:#101725;color:white;cursor:pointer;">Logout</button>
        </header>
        <main class="chat-content">
            <input class="search" id="searchUsers" type="search" placeholder="🔍 Search users...">
            <div class="user-list" id="userList"></div>
        </main>
    </section>
</div>

<script>
const SUPABASE_URL = window.location.origin + "/api";
const SUPABASE_KEY = "sb_publishable_304Z-38ePX_x0FNMkB0Pow_TUUqvLns";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const authPage = document.getElementById("authPage");
const chatPage = document.getElementById("chatPage");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const usernameInput = document.getElementById("username");
const authButton = document.getElementById("authButton");
const messageBox = document.getElementById("message");
const usernameGroup = document.getElementById("usernameGroup");
const authTitle = document.getElementById("authTitle");
const authSubtitle = document.getElementById("authSubtitle");
const switchText = document.getElementById("switchText");
const switchButton = document.getElementById("switchButton");
const userList = document.getElementById("userList");

let registerMode = false;

function showMessage(text, type = "error") {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
}

switchButton.addEventListener("click", () => {
    registerMode = !registerMode;
    if(registerMode) {
        authTitle.textContent = "Create Account";
        usernameGroup.classList.remove("hidden");
        authButton.textContent = "Create Account";
        switchText.textContent = "Already have an account?";
        switchButton.textContent = "Sign in";
    } else {
        authTitle.textContent = "Welcome Back";
        usernameGroup.classList.add("hidden");
        authButton.textContent = "Sign In";
        switchText.textContent = "Don't have an account?";
        switchButton.textContent = "Create account";
    }
});

authButton.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const username = usernameInput.value.trim();

    if(!email || !password) {
        showMessage("Please fill in all fields.");
        return;
    }

    authButton.disabled = true;
    try {
        if(registerMode) {
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if(error) throw error;
            if(data.user) {
                await supabaseClient.from("profiles").insert({ id: data.user.id, username });
            }
            showMessage("Account created successfully.", "success");
        } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if(error) throw error;
            openChat();
        }
    } catch(err) {
        showMessage(err.message);
    } finally {
        authButton.disabled = false;
    }
});

async function openChat() {
    authPage.style.display = "none";
    chatPage.style.display = "block";
    loadUsers();
}

async function loadUsers() {
    const { data } = await supabaseClient.from("profiles").select("id, username");
    userList.innerHTML = "";
    (data || []).forEach(u => {
        const div = document.createElement("div");
        div.className = "user";
        div.innerHTML = `<div class="avatar">${u.username.charAt(0).toUpperCase()}</div><div><b>${u.username}</b></div>`;
        userList.appendChild(div);
    });
}

document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    chatPage.style.display = "none";
    authPage.style.display = "flex";
});

supabaseClient.auth.onAuthStateChange((event, session) => {
    if(session) openChat();
});
</script>
</body>
</html>
